<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Moonlight Glow Garden 🌸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #scene {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      cursor: crosshair;
    }
    canvas {
      display: block; width: 100%; height: 100%;
    }
    #hud {
      position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      display: flex; gap: 0.75rem; align-items: center;
      background: rgba(10,10,26,0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(192,132,252,0.2);
      border-radius: 2rem; padding: 0.45rem 1.1rem;
      color: #e0d4ff; font-size: 0.85rem;
      opacity: 0; transition: opacity 1s;
    }
    #hud.visible { opacity: 1; }
    #hud .icon { font-size: 1.1rem; }
    #hud .count { font-weight: 600; min-width: 1.5rem; text-align: center; color: #c084fc; }
    #hint {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      background: rgba(10,10,26,0.55); backdrop-filter: blur(4px);
      border-radius: 1rem; padding: 0.35rem 0.9rem;
      color: rgba(224,212,255,0.45); font-size: 0.8rem;
      transition: opacity 2s;
    }
    #hint.hidden { opacity: 0; }
    #cursor-glow {
      position: fixed;
      width: 32px; height: 32px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      display: none;
      background: radial-gradient(circle, rgba(192,132,252,0.3) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }
    @media (max-width: 480px) {
      #hud { font-size: 0.75rem; padding: 0.3rem 0.8rem; }
      #hint { font-size: 0.7rem; }
      #cursor-glow { display: none !important; }
    }
    @media (pointer: coarse) {
      #cursor-glow { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      canvas { image-rendering: crisp-edges; }
      #hud, #hint { transition-duration: 0.01s !important; }
    }
  </style>
</head>
<body>
  <div id="scene" role="img" aria-label="Moonlight Glow Garden — a cozy interactive garden where you plant glowing flowers"><canvas id="garden"></canvas></div>
  <div id="cursor-glow"></div>
  <div id="hud" class="visible" role="status" aria-live="polite" aria-label="Flower count">
    <span class="icon" aria-hidden="true">🌸</span>
    <span>blooming</span>
    <span class="count" id="flower-count" aria-label="active flowers">0</span>
  </div>
  <div id="hint" role="tooltip">tap anywhere to plant a seed 🌱</div>

  <script>
    (function () {
      const canvas = document.getElementById('garden');
      const ctx = canvas.getContext('2d');
      const countEl = document.getElementById('flower-count');
      const hintEl = document.getElementById('hint');
      const cursorGlow = document.getElementById('cursor-glow');

      let W, H;
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // Cursor trail positions
      let cursorX = W/2, cursorY = H/2;
      let cursorHistory = [];
      document.addEventListener('mousemove', function (e) {
        cursorX = e.clientX;
        cursorY = e.clientY;
        cursorHistory.push({ x: cursorX, y: cursorY, time: performance.now() });
        if (cursorHistory.length > 12) cursorHistory.shift();
        if (!window.matchMedia('(pointer: coarse)').matches) {
          cursorGlow.style.display = 'block';
          cursorGlow.style.left = cursorX + 'px';
          cursorGlow.style.top = cursorY + 'px';
        }
      });

      // ---- Stars ----
      const stars = [];
      for (let i = 0; i < 140; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random() * 0.75,
          size: Math.random() * 1.8 + 0.3,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.025 + 0.004
        });
      }

      // ---- Comet ----
      let comet = null;
      function spawnComet() {
        if (comet && comet.life > 0.3) return;
        comet = {
          x: Math.random() * W * 0.5 + W * 0.1,
          y: Math.random() * H * 0.3 + 10,
          vx: 2 + Math.random() * 2,
          vy: 0.5 + Math.random() * 0.8,
          life: 1.0,
          tailLen: 60 + Math.random() * 40,
        };
      }

      // ---- Flowers ----
      const flowers = [];
      const MAX_FLOWERS = 40;
      const FLOWER_LIFETIME = 14000;
      const BLOOM_DURATION = 1400;
      let frame = 0;
      let audioCtx = null;

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientDrone();
      }

      // ---- Ambient drone ----
      let droneNodes = null;
      function startAmbientDrone() {
        if (!audioCtx || droneNodes) return;
        try {
          const now = audioCtx.currentTime;
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(55, now);
          osc2.frequency.setValueAtTime(65.41, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 2);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc2.start(now);
          droneNodes = { osc1, osc2, gain };
        } catch(e) {}
      }

      let arpeggioTimer = 0;

      function playChime(freq, duration) {
        if (!audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 1.5, now);
          gain2.gain.setValueAtTime(0, now);
          gain2.gain.linearRampToValueAtTime(0.016, now + 0.03);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.6);
          osc2.start(now);
          osc2.stop(now + duration * 0.6);
          osc.start(now);
          osc.stop(now + duration);
        } catch(e) {}
      }

      function playArpeggio() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 523.25];
        notes.forEach((freq, i) => {
          setTimeout(() => playChime(freq, 0.3), i * 80);
        });
      }

      const COLORS = [
        { inner: '#c084fc', outer: '#a78bfa', petal: '#e0d4ff' },
        { inner: '#f9a8d4', outer: '#f472b6', petal: '#fbcfe8' },
        { inner: '#818cf8', outer: '#6366f1', petal: '#c7d2fe' },
        { inner: '#c4b5fd', outer: '#a78bfa', petal: '#ddd6fe' },
        { inner: '#fbbf24', outer: '#f59e0b', petal: '#fde68a' },
      ];

      // ---- Ease-out cubic ----
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      // ---- Motes ----
      class Mote {
        constructor(x, y, color) {
          this.x = x; this.y = y;
          this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 0.5 + 0.1;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 0.35;
          this.life = 1.0;
          this.decay = 0.005 + Math.random() * 0.004;
          this.size = Math.random() * 2 + 0.8;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.0015;
          this.life -= this.decay;
        }
        draw(ctx) {
          if (this.life <= 0) return;
          ctx.save();
          ctx.globalAlpha = this.life * 0.5;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      function spawnMotes(f) {
        for (let i = 0; i < 5; i++) {
          f.motes.push(new Mote(f.x, f.y, f.petalColor));
        }
      }

      // ---- Sparkle ----
      class Sparkle {
        constructor(x, y, color) {
          this.x = x; this.y = y;
          this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 2 + 1;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.life = 1.0;
          this.decay = 0.02 + Math.random() * 0.015;
          this.size = Math.random() * 2.5 + 1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
        }
        draw(ctx) {
          if (this.life <= 0) return;
          ctx.save();
          ctx.globalAlpha = this.life * 0.7;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      function spawnBloomSparkles(f) {
        for (let i = 0; i < 14; i++) {
          f.sparkles.push(new Sparkle(f.x, f.y, '#ffffff'));
        }
      }

      // ---- Seed indicator (small dot rising before bloom) ----
      class SeedDot {
        constructor(x, y) {
          const groundY = Math.max(y, H * 0.65 + 20);
          this.x = x;
          this.startY = groundY;
          this.y = groundY;
          this.targetY = y;
          this.birth = performance.now();
          this.duration = 400;
          this.size = 3;
        }
        update() {
          const age = performance.now() - this.birth;
          const progress = Math.min(1, age / this.duration);
          this.y = this.startY + (this.targetY - this.startY) * easeOut(progress);
          return progress < 1;
        }
        draw(ctx) {
          const age = performance.now() - this.birth;
          const progress = Math.min(1, age / this.duration);
          const alpha = progress > 0.5 ? 1 - progress * 2 : progress * 2;
          ctx.save();
          ctx.globalAlpha = alpha * 0.7;
          ctx.fillStyle = '#c084fc';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      const seeds = [];

      function addFlower(x, y) {
        if (flowers.length >= MAX_FLOWERS) return;
        const groundY = H * 0.65;
        if (y < groundY) y = groundY + (groundY - y) * 0.1;
        y = Math.min(y, H - 20);
        const palette = COLORS[Math.floor(Math.random() * COLORS.length)];
        const size = 7 + Math.random() * 14;

        // Show seed rising
        seeds.push(new SeedDot(x, y));

        flowers.push({
          x, y,
          size,
          phase: 0,
          birth: performance.now(),
          colorInner: palette.inner,
          colorOuter: palette.outer,
          petalColor: palette.petal,
          moteTimer: 0,
          motes: [],
          sparkles: [],
          glowPhase: Math.random() * Math.PI * 2,
          bloomed: false,
        });
        const notes = [523.25, 587.33, 659.25, 783.99, 1046.5, 698.46, 880, 392];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        playChime(freq, 0.55);
        hintEl.classList.add('hidden');
      }

      function handlePlant(e) {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        let cx, cy;
        if (e.touches) {
          e.preventDefault();
          cx = e.touches[0].clientX;
          cy = e.touches[0].clientY;
        } else {
          cx = e.clientX;
          cy = e.clientY;
        }
        if (!rect.width || !rect.height) return;
        const x = (cx - rect.left) / rect.width * W;
        const y = (cy - rect.top) / rect.height * H;
        addFlower(x, y);
      }
      canvas.addEventListener('click', handlePlant);
      canvas.addEventListener('touchstart', handlePlant, { passive: false });

      // ---- Draw loop ----
      function draw() {
        frame++;
        const now = performance.now();

        // Periodic comet
        if (frame % 600 === 0 && Math.random() < 0.4) spawnComet();

        // --- Sky ---
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0a0a2e');
        grad.addColorStop(0.45, '#15153e');
        grad.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // --- Ground ---
        const groundY = H * 0.65;
        const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
        groundGrad.addColorStop(0, 'rgba(25,20,45,0.5)');
        groundGrad.addColorStop(0.3, 'rgba(20,16,35,0.7)');
        groundGrad.addColorStop(1, 'rgba(15,10,25,0.95)');
        ctx.fillStyle = groundGrad;
        ctx.beginPath();
        ctx.rect(0, groundY, W, H - groundY);
        ctx.fill();

        // Grass blades
        ctx.strokeStyle = 'rgba(192,132,252,0.04)';
        ctx.lineWidth = 0.8;
        const bladeSeed = frame / 100;
        for (let i = 0; i < 50; i++) {
          const gx = ((i * 137 + bladeSeed * 23) % 1000) / 1000 * W;
          const gy = groundY + 4 + ((i * 47 + bladeSeed * 11) % 1000) / 1000 * (H - groundY - 10);
          const len = 4 + ((i * 31 + bladeSeed * 7) % 1000) / 1000 * 6;
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          const dx = Math.sin(i * 0.6 + bladeSeed * 0.5) * 8;
          ctx.lineTo(gx + dx, gy - len);
          ctx.stroke();
        }

        // --- Stars ---
        for (const s of stars) {
          const tw = Math.sin(frame * s.speed + s.twinkle) * 0.55 + 0.45;
          ctx.save();
          ctx.globalAlpha = tw * 0.65;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // --- Comet ---
        if (comet && comet.life > 0) {
          comet.x += comet.vx;
          comet.y += comet.vy;
          comet.life -= 0.003;
          ctx.save();
          ctx.globalAlpha = comet.life * 0.6;
          // Tail
          ctx.strokeStyle = 'rgba(192,132,252,0.5)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(comet.x, comet.y);
          ctx.lineTo(comet.x - comet.tailLen, comet.y - comet.tailLen * 0.5);
          ctx.stroke();
          // Head
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(comet.x, comet.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          if (comet.life <= 0) comet = null;
        }

        // --- Moon glow ---
        const moonX = W * 0.82;
        const moonY = H * 0.2;
        const moonGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 60 + Math.sin(frame * 0.003) * 8);
        moonGrad.addColorStop(0, 'rgba(192,132,252,0.08)');
        moonGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = moonGrad;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 70, 0, Math.PI * 2);
        ctx.fill();

        // --- Seeds ---
        for (let si = seeds.length - 1; si >= 0; si--) {
          const alive = seeds[si].update();
          seeds[si].draw(ctx);
          if (!alive) seeds.splice(si, 1);
        }

        // --- Flowers ---
        let activeCount = 0;
        for (let fi = flowers.length - 1; fi >= 0; fi--) {
          const f = flowers[fi];
          const age = now - f.birth;
          const life = 1 - age / FLOWER_LIFETIME;
          if (life <= 0) { flowers.splice(fi, 1); continue; }
          activeCount++;

          const rawPhase = age / BLOOM_DURATION;
          f.phase = Math.min(1, rawPhase);
          const grow = easeOut(Math.min(1, rawPhase));
          f.glowPhase += 0.03;
          const glow = Math.sin(f.glowPhase) * 0.12 + 0.88;

          // Sparkle burst on full bloom + arpeggio
          if (grow >= 1 && !f.bloomed) {
            f.bloomed = true;
            spawnBloomSparkles(f);
            playArpeggio();
          }

          // Motes
          f.moteTimer += 0.35;
          if (f.moteTimer >= 1) { f.moteTimer = 0; if (f.motes.length < 35) spawnMotes(f); }
          for (let mi = f.motes.length - 1; mi >= 0; mi--) {
            f.motes[mi].update();
            if (f.motes[mi].life <= 0) f.motes.splice(mi, 1);
          }
          for (let si = f.sparkles.length - 1; si >= 0; si--) {
            f.sparkles[si].update();
            if (f.sparkles[si].life <= 0) f.sparkles.splice(si, 1);
          }

          // Glow
          const gs = f.size * 3.2 * glow * grow;
          ctx.save();
          ctx.globalAlpha = glow * 0.3 * life;
          const rad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, gs);
          rad.addColorStop(0, f.colorInner + '50');
          rad.addColorStop(1, f.colorOuter + '00');
          ctx.fillStyle = rad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, gs, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Stem (only for fully grown flowers)
          if (grow > 0.3) {
            ctx.save();
            ctx.globalAlpha = life * 0.3 * Math.min(1, (grow - 0.3) * 2);
            ctx.strokeStyle = 'rgba(192,132,252,0.15)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            const stemEnd = Math.min(groundY + 40, f.y + f.size * 0.8 * grow);
            ctx.lineTo(f.x, stemEnd);
            ctx.stroke();
            ctx.restore();
          }

          // Petals
          const pc = 6 + Math.sin(f.glowPhase * 0.5) * 0.5;
          const pl = f.size * 1.1 * grow;
          const pw = f.size * 0.40 * grow;
          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.globalAlpha = life * 0.95;
          for (let p = 0; p < pc; p++) {
            const ang = (p / pc) * Math.PI * 2;
            ctx.save();
            ctx.rotate(ang);
            ctx.scale(1, 0.55);
            const pg = ctx.createRadialGradient(0, pl * 0.25, 0, 0, pl * 0.35, pl * 0.9);
            pg.addColorStop(0, f.petalColor + 'e0');
            pg.addColorStop(0.5, f.colorOuter + '80');
            pg.addColorStop(1, f.colorOuter + '30');
            ctx.fillStyle = pg;
            ctx.beginPath();
            ctx.ellipse(0, pl * 0.35, pw * 0.9, pl * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          // Center glow
          const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, f.size * 0.45 * grow);
          cg.addColorStop(0, '#ffffff');
          cg.addColorStop(0.25, f.colorInner);
          cg.addColorStop(1, 'transparent');
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(0, 0, f.size * 0.45 * grow, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Motes
          for (const m of f.motes) m.draw(ctx);
          // Sparkles
          for (const s of f.sparkles) s.draw(ctx);
        }

        countEl.textContent = activeCount;

        // Cursor trail shimmer
        if (!window.matchMedia('(pointer: coarse)').matches) {
          const gx = cursorX / window.innerWidth * W;
          const gy = cursorY / window.innerHeight * H;
          // Main hover glow
          ctx.save();
          ctx.globalAlpha = 0.25;
          const hg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 26);
          hg.addColorStop(0, 'rgba(192,132,252,0.2)');
          hg.addColorStop(1, 'transparent');
          ctx.fillStyle = hg;
          ctx.beginPath();
          ctx.arc(gx, gy, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // Trail
          for (let ti = 0; ti < cursorHistory.length; ti++) {
            const t = cursorHistory[ti];
            const alpha = (ti / cursorHistory.length) * 0.12;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(192,132,252,0.15)';
            ctx.beginPath();
            ctx.arc(t.x / window.innerWidth * W, t.y / window.innerHeight * H, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
