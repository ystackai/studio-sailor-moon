<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moon Prism Relay</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0b0b2a;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
}
canvas#gameCanvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:1; pointer-events:none;
}
canvas#uiCanvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:2; pointer-events:auto;
}
#startScreen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:10; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(circle at 50% 40%, rgba(11,11,42,0.01) 0%, rgba(11,11,42,0.10) 48%, rgba(11,11,42,0.22) 78%);
  pointer-events:none;
}
#startScreen .card {
  text-align:center;
  background: rgba(15, 14, 45, 0.26);
  border: 0.8px solid rgba(236,72,153,0.16);
  border-radius: 14px;
  padding: 12px 16px 11px;
  box-shadow: 0 0 0 1px rgba(168,85,247,0.10), 0 12px 36px rgba(0,0,0,0.35);
  max-width: 86%;
  width: 320px;
  pointer-events:auto;
}
#startScreen h1 {
  font-size:clamp(22px, 5.2vw, 38px); color:#f8fafc;
  text-shadow: 0 0 16px #c084fc, 0 0 30px #a855f7;
  letter-spacing:2.2px; margin-bottom:2px;
}
#startScreen .tag {
  font-size:clamp(11px, 2.0vw, 13px); color:#e0d4ff;
  margin-bottom:10px; letter-spacing:0.4px; line-height:1.3;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  opacity:0.92;
}
#startScreen .legend {
  font-size:clamp(8.5px, 1.5vw, 10px); color:#a5b4fc;
  margin: 4px 0 8px; letter-spacing:0.3px; line-height:1.25;
  text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  opacity:0.75;
}
#startScreen .legend .k {
  display:inline-block; padding:0 4px; margin:0 1px;
  background:rgba(168,85,247,0.18); border:1px solid rgba(236,72,153,0.28);
  border-radius:4px; color:#c8b5ff; font-weight:600; font-size:0.88em;
}
#startBtn {
  padding:11px 28px; font-size:clamp(14px, 2.6vw, 17px);
  background:linear-gradient(135deg, #ec4899, #a855f7);
  color:#fff; border:none; border-radius:26px; cursor:pointer;
  box-shadow:0 0 18px rgba(236,72,153,0.45), 0 0 36px rgba(168,85,247,0.28);
  transition:transform 0.18s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.18s;
  pointer-events:auto; letter-spacing:0.8px; font-weight:600;
}
#startBtn:hover { transform:translateY(-1px) scale(1.02); box-shadow:0 0 26px rgba(236,72,153,0.6); }
#startBtn:active { transform:scale(0.985); }
#touchControls {
  position:fixed; bottom:0; left:0; width:100%; z-index:5;
  display:none; justify-content:space-between; padding:10px 8px;
  pointer-events:none;
}
.touchBtn {
  width:58px; height:58px; border-radius:50%;
  background:rgba(168,85,247,0.32); border:2px solid rgba(236,72,153,0.55);
  display:flex; align-items:center; justify-content:center;
  color:#f0abfc; font-size:21px; pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
.touchBtn:active { background:rgba(236,72,153,0.55); }
.touchBtnGroup { display:flex; gap:7px; }
#comboDisplay {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:8; font-size:clamp(34px,8vw,68px); font-weight:bold;
  color:#f0abfc; text-shadow:0 0 28px #c084fc;
  opacity:0; pointer-events:none; transition:opacity 0.28s, transform 0.28s;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<div id="startScreen">
  <div class="card">
    <h1>🌙 Moon Prism Relay 🌙</h1>
    <div class="tag">Skate the moonlit lanes. Chain the shards. Become the light.</div>
    <button id="startBtn">✦ Start Transform ✦</button>
    <div class="legend">
      <span class="k">←→</span> switch lanes &nbsp; <span class="k">↑</span> jump shadows &nbsp; <span class="k">↓</span> dash orbs &nbsp; <span class="k">X</span> prism power
    </div>
    <div id="startBest" style="margin-top:4px;font-size:10px;letter-spacing:0.5px;color:#a5b4fc;opacity:0.85;"></div>
  </div>
</div>

<div id="touchControls">
  <div class="touchBtnGroup">
    <div class="touchBtn" id="btnLeft">◀</div>
    <div class="touchBtn" id="btnDown">▼</div>
  </div>
  <div class="touchBtnGroup">
    <div class="touchBtn" id="btnUp">▲</div>
    <div class="touchBtn" id="btnRight">▶</div>
  </div>
</div>

<div id="comboDisplay"></div>

<script>
(function() {
"use strict";

// ========== CANVAS SETUP ==========
const gameCanvas = document.getElementById('gameCanvas');
const uiCanvas = document.getElementById('uiCanvas');
const gctx = gameCanvas.getContext('2d');
const uctx = uiCanvas.getContext('2d');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  gameCanvas.width = uiCanvas.width = W * DPR;
  gameCanvas.height = uiCanvas.height = H * DPR;
  gameCanvas.style.width = uiCanvas.style.width = W + 'px';
  gameCanvas.style.height = uiCanvas.style.height = H + 'px';
  gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  uctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ========== AUDIO ENGINE ==========
let audioCtx = null;
let audioStarted = false;

function ensureAudio() {
  if (audioStarted) return;
  audioStarted = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startMusic();
}

function playTone(freq, dur, type, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.12, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function playCollect() {
  playTone(880, 0.15, 'sine', 0.15);
  playTone(1320, 0.12, 'sine', 0.08, 0.05);
}

function playHit() {
  playTone(150, 0.3, 'sawtooth', 0.12);
  playTone(80, 0.25, 'square', 0.06, 0.05);
  playNoiseBurst(0.09, 0.22, 0.0, 'low');
}

function playJump() {
  playTone(400, 0.15, 'sine', 0.08);
  playTone(600, 0.12, 'sine', 0.06, 0.08);
}

function playDash() {
  playTone(200, 0.2, 'triangle', 0.1);
  playTone(300, 0.15, 'sine', 0.06, 0.1);
}

function playPowerUp() {
  playTone(523, 0.15, 'sine', 0.15);
  playTone(659, 0.15, 'sine', 0.12, 0.1);
  playTone(784, 0.2, 'sine', 0.12, 0.2);
  playTone(1047, 0.3, 'sine', 0.15, 0.3);
}

function playCombo(level) {
  const base = 660 + level * 60;
  playTone(base, 0.2, 'sine', 0.1);
  playTone(base * 1.5, 0.15, 'sine', 0.08, 0.08);
}

function playDeflect(kind) {
  // Bright, high-energy chime for successful deflect (ritual precision)
  const base = kind === 'dash' ? 980 : 1240;
  playTone(base, 0.12, 'sine', 0.13);
  playTone(base * 1.25, 0.09, 'triangle', 0.07, 0.04);
}

// ========== DELIBERATE PROCEDURAL MUSIC SYSTEM (SPASS) ==========
// Addresses asset-guard: no foundry exposed; created authored generative score
// for central music-led moments (city loop, transformation, wave surges).
// Gesture-gated only. Multi-voice scheduler + noise bursts for texture.
// Not sparse bleeps — deliberate 8-bar lunar skate motif + ritual chords.

let musicTime = 0;
let musicEnabled = false;
let musicNotes = []; // scheduled {t, f, dur, type, vol, pan?}

function scheduleNote(freq, dur, type, vol, when) {
  if (!audioCtx || !musicEnabled) return;
  const t = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2200, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(vol || 0.08, t + 0.025);
  gain.gain.linearRampToValueAtTime(0.0001, t + dur);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

function playNoiseBurst(vol, dur, when, color) {
  if (!audioCtx || !musicEnabled) return;
  const t = audioCtx.currentTime + (when || 0);
  const noise = audioCtx.createBufferSource();
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = color === 'low' ? 'lowpass' : 'bandpass';
  filter.frequency.setValueAtTime(color === 'low' ? 420 : 1800, t);
  gain.gain.setValueAtTime(vol * 0.9, t);
  gain.gain.linearRampToValueAtTime(0.0001, t + dur);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(t);
}

function startMusic() {
  if (musicEnabled) return;
  musicEnabled = true;
  musicTime = 0;
  musicNotes = [];
}

function stopMusic() {
  musicEnabled = false;
  musicNotes = [];
}

// Authored "Moonlit City Skate" motif (sparse, high-energy, moonlight pad + prism twinkle)
// 8 "beats" repeating; called from update when playing.
function updateMusic(dt) {
  if (!musicEnabled || !audioCtx) return;
  musicTime += dt;
  // Drain old notes
  const now = audioCtx.currentTime;
  musicNotes = musicNotes.filter(n => (n.t + n.dur) > now);

  // Gentle city pad chord (root 5th for moon feel) every ~1.6s
  const beat = 0.82; // tempo
  const phase = Math.floor(musicTime / beat) % 8;
  const bar = Math.floor(musicTime / (beat * 8));

  // Low pad (city rumble + hope)
  if (phase === 0 || phase === 4) {
    scheduleNote(98, 1.6, 'sine', 0.035, 0.0);
    scheduleNote(147, 1.55, 'sine', 0.028, 0.02);
  }
  // Mid prism arpeggio (shards / relay energy)
  const arp = [392, 494, 587, 659, 784, 659, 587, 494];
  if (phase < 7) {
    const f = arp[phase];
    scheduleNote(f, 0.28, 'sine', 0.055 + (superActive ? 0.02 : 0), 0.0);
    if (phase % 2 === 1) scheduleNote(f * 1.5, 0.18, 'triangle', 0.03, 0.04);
  }
  // Soft noise tick (skate on moonlight)
  if (phase === 1 || phase === 5) {
    playNoiseBurst(0.018, 0.09, 0.0, 'low');
  }
  // Wave / super lift
  if (superActive && (phase === 2 || phase === 6)) {
    scheduleNote(880 + (bar % 3) * 110, 0.35, 'sine', 0.07, 0.0);
  }
}

// Ritual "Moon Prism Power" transformation motif (5s, music-led climax)
function playSuperTheme() {
  if (!audioCtx || !musicEnabled) return;
  const t0 = 0.0;
  // Rising henshin chords (theatrical, sincere)
  const chords = [
    [523, 659, 784],   // C
    [587, 698, 880],   // D
    [659, 784, 988],   // E
    [784, 988, 1175],  // G
    [880, 1047, 1319]  // A
  ];
  chords.forEach((chord, i) => {
    chord.forEach((f, j) => {
      scheduleNote(f, 0.9, j === 0 ? 'sine' : 'triangle', 0.06 + j * 0.01, t0 + i * 0.28);
    });
  });
  // Final sustained power chord + shimmer
  setTimeout(() => {
    if (!audioCtx || !musicEnabled) return;
    scheduleNote(1047, 2.2, 'sine', 0.09, 0.0);
    scheduleNote(1319, 2.1, 'sine', 0.07, 0.05);
    scheduleNote(1568, 1.8, 'triangle', 0.05, 0.1);
    playNoiseBurst(0.025, 1.4, 0.2, 'low');
  }, 1200);
}

// Wave surge bright motif (ties to visual gold power lines + gift shards)
function playWaveSurge() {
  if (!audioCtx || !musicEnabled) return;
  const up = [659, 784, 988, 1319];
  up.forEach((f, i) => scheduleNote(f, 0.22, 'sine', 0.08, i * 0.09));
  scheduleNote(784, 0.6, 'triangle', 0.05, 0.36);
}

// ========== GAME STATE ==========
const LANES = [-1, 0, 1];
const LANE_WIDTH_RATIO = 0.22;
const PLAYER_SPEED_BASE = 300;
const LANE_SWAP_SPEED = 12;
const GRAVITY = 1200;
const JUMP_FORCE = -520;
const DASH_DURATION = 0.4;
const DASH_BOOST = 2.5;

let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('mprHighScore') || '0');
let combo = 0;
let comboTimer = 0;
let comboMultiplier = 1;
let moonGauge = 0;
const MOON_MAX = 100;
let wave = 1;
let waveTimer = 0;
let waveDuration = 30;
let gameTime = 0;
let difficulty = 1;
let screenShake = 0;
let screenShakeX = 0, screenShakeY = 0;
let superActive = false;
let superTimer = 0;
let superFlash = 0;
let waveFlash = 0;  // brief lane/ground energy surge on wave advance (theatrical escalation + bright readable power moment)
let stars = [];
let buildings = [];
let groundBuildings = [];
let obstacles = [];
let shards = [];
let particles = [];
let trailParticles = [];
let laneSwishes = [];      // living ribbon swish on lane change (physicality + house fabric)
let deflectSlashes = [];   // bright crescent geometry slash on successful deflect
let scorePops = [];        // rising +pts labels on collect/deflect — immediate high-energy scoring feedback
let wavePop = null;        // brief centered wave-advance flourish (theatrical escalation)
let spawnTimer = 0;
let shardSpawnTimer = 0;
let obstacleSpawnTimer = 0;
let demoAmbienceTimer = 0; // drives slow visible pickups + shadow echoes on first screen (addresses playtest: start in action)
let demoPreviewUntil = 0;  // window for pre-start lane preview swishes (keys work on title for interactive playable slice, eases back)

// Player
let player = {
  lane: 0,
  targetLane: 0,
  x: 0, y: 0,
  vy: 0,
  jumping: false,
  dashing: false,
  dashTimer: 0,
  grounded: true,
  width: 58,
  height: 76,
  invincible: false,
  invincibleTimer: 0,
  rotation: 0,
  bodyHue: 330,
  glowPulse: 0,
  transformFlash: 0,
};

// ========== INIT SCENERY ==========
function initScenery() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      size: Math.random() * 2 + 0.5,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.3 + 0.1
    });
  }
  buildings = [];
  for (let i = 0; i < 20; i++) {
    const isSpire = Math.random() < 0.22;
    const hasRibbon = Math.random() < 0.28;
    buildings.push({
      x: i * (W / 8) - 100 + Math.random() * 50,
      w: 30 + Math.random() * 60,
      h: 60 + Math.random() * 120,
      color: `hsl(${230 + Math.random()*20}, ${20+Math.random()*15}%, ${8+Math.random()*8}%)`,
      windows: Math.floor(Math.random() * 5) + 2,
      parallax: 0.3 + Math.random() * 0.2,
      isSpire,
      hasRibbon,
      lampPhase: Math.random() * Math.PI * 2
    });
  }
  groundBuildings = [];
  for (let i = 0; i < 15; i++) {
    const hasLamp = Math.random() < 0.65;
    groundBuildings.push({
      x: i * (W / 5) - 80 + Math.random() * 40,
      w: 40 + Math.random() * 50,
      h: 30 + Math.random() * 50,
      color: `hsl(${240 + Math.random()*15}, ${15+Math.random()*10}%, ${5+Math.random()*5}%)`,
      windows: Math.floor(Math.random() * 4) + 1,
      parallax: 0.6 + Math.random() * 0.2,
      hasLamp,
      lampPhase: Math.random() * Math.PI * 2
    });
  }
}

function resetGame() {
  score = 0;
  combo = 0;
  comboTimer = 0;
  comboMultiplier = 1;
  moonGauge = 0;
  wave = 1;
  waveTimer = 0;
  gameTime = 0;
  difficulty = 1;
  screenShake = 0;
  superActive = false;
  superTimer = 0;
  superFlash = 0;
  obstacles = [];
  shards = [];
  particles = [];
  trailParticles = [];
  laneSwishes = [];
  deflectSlashes = [];
  scorePops = [];
  wavePop = null;
  waveFlash = 0;
  spawnTimer = 0;
  shardSpawnTimer = 0;
  obstacleSpawnTimer = 0;
  demoAmbienceTimer = 0;
  demoPreviewUntil = 0;
  player.lane = 0;
  player.targetLane = 0;
  player.x = W * 0.2;
  const groundY = H * 0.78;
  player.y = groundY - player.height;
  player.vy = 0;
  player.jumping = false;
  player.dashing = false;
  player.dashTimer = 0;
  player.grounded = true;
  player.invincible = false;
  player.invincibleTimer = 0;
  player.rotation = 0;
  player.glowPulse = 0;
  player.transformFlash = 0;
}

// ========== LANE HELPERS ==========
function getLaneX(lane) {
  const totalWidth = LANES.length * LANE_WIDTH_RATIO * W;
  const startX = (W - totalWidth) / 2;
  return startX + lane * LANE_WIDTH_RATIO * W + LANE_WIDTH_RATIO * W / 2;
}

function getGroundY() {
  return H * 0.78;
}

// ========== SPAWNING ==========
function spawnShard() {
  const laneIdx = Math.floor(Math.random() * 3);
  const lane = LANES[laneIdx];
  shards.push({
    x: W + 20,
    lane: lane,
    targetX: getLaneX(lane),
    y: getGroundY() - 30 - Math.random() * 60,
    size: 30,
    rotation: 0,
    glow: 0,
    collected: false,
    color: Math.random() > 0.5 ? '#f0abfc' : '#93c5fd',
    hue: Math.random() > 0.5 ? 300 : 210
  });
}

function spawnObstacle() {
  const laneIdx = Math.floor(Math.random() * 3);
  const lane = LANES[laneIdx];
  const types = ['shadow', 'shadow', 'shadow'];
  if (wave >= 2) types.push('shadow_ball');
  if (wave >= 3) types.push('shadow_spike');
  const type = types[Math.floor(Math.random() * types.length)];

  let obs = {
    x: W + 30,
    lane: lane,
    targetX: getLaneX(lane),
    type: type,
    hit: false
  };

  if (type === 'shadow') {
    obs.y = getGroundY() - 36;
    obs.w = 30;
    obs.h = 36;
    obs.eyes = Math.floor(Math.random()*3)+1;
  } else if (type === 'shadow_ball') {
    obs.y = getGroundY() - 120 - Math.random() * 40;
    obs.w = 28;
    obs.h = 28;
  } else if (type === 'shadow_spike') {
    obs.y = getGroundY() - 60;
    obs.w = 24;
    obs.h = 60;
  }

  obstacles.push(obs);
}

function spawnParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread + 40;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 30,
      life: 1,
      decay: 0.8 + Math.random() * 1.2,
      size: 2 + Math.random() * 4,
      color: color,
      gravity: 200
    });
  }
}

// Ambient demo activity (first-screen only): slow visible prism shards (movement goals + collectibles) + one faint shadow echo (deflect hazard silhouette) to make the title scene feel alive and "in action" per playtest feedback. No scoring, no collisions, no UI. Faint "echo" rendering + occasional passing twinkle for prism/relay feedback.
function updateDemoAmbience(dt, speedMul) {
  demoAmbienceTimer += dt;
  const demoSpeed = 165 * speedMul; // gentle preview scroll, keeps focus on skyline + character

  // Advance any ambient-tagged elements (populated below or seeded)
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    if (!s.ambient) continue;
    s.x -= demoSpeed * dt;
    s.rotation += dt * 2.2;
    s.glow = (Math.sin(s.rotation * 2) + 1) * 0.5;
    if (s.x < -50) { shards.splice(i, 1); continue; }
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (!o.ambient) continue;
    o.x -= demoSpeed * 0.65 * dt;
    if (o.x < -90) { obstacles.splice(i, 1); continue; }
  }

  // Spawn 1-3 ambient prism shard echoes (visible pickups, immediate movement goals) — more direct first-screen action per contact-sheet
  const ambientShardCount = shards.filter(s => s.ambient).length;
  if (demoAmbienceTimer > 1.05 && ambientShardCount < 3) {
    demoAmbienceTimer = Math.random() * 0.32;
    const lane = LANES[Math.floor(Math.random() * 3)];
    shards.push({
      x: W + 55,
      lane: lane,
      targetX: getLaneX(lane),
      y: getGroundY() - 30 - Math.random() * 58,
      size: 22,
      rotation: Math.random() * 5,
      glow: 0.35,
      collected: false,
      color: '#f0abfc',
      hue: 300,
      ambient: true
    });
  }

  // 1-2 slow ambient shadow echoes (visible hazard to convey "deflect/avoid" verb) — more direct
  const ambientShadowCount = obstacles.filter(o => o.ambient).length;
  if (demoAmbienceTimer > 1.85 && ambientShadowCount < 2) {
    demoAmbienceTimer = 0.65;
    if (Math.random() < 0.72) {
      const lane = LANES[Math.floor(Math.random() * 3)];
      obstacles.push({
        x: W + 75,
        lane: lane,
        targetX: getLaneX(lane),
        y: getGroundY() - 38,
        w: 34, h: 40,
        type: 'shadow',
        eyes: 1,
        hit: false,
        ambient: true
      });
    }
  }

  // Subtle prism feedback: twinkle particles when an ambient shard "passes" the player zone (clear relay/collect motion)
  for (const s of shards) {
    if (s.ambient && !s._twinkled && s.x < player.x + 24 && s.x > player.x - 80) {
      s._twinkled = true;
      spawnParticles(s.x + 6, s.y, '#fde68a', 3, 26);
    }
  }
}

// ========== UPDATE ==========
let lastTime = 0;

function update(dt) {
  if (state !== 'playing' && state !== 'start') return;

  const isDemo = state === 'start';
  const speedMul = isDemo ? 0.35 : 1;

  updateMusic(dt); // deliberate procedural score (SPASS) — city motif + ritual moments

  if (!isDemo) {
    gameTime += dt;
    waveTimer += dt;

    // Wave escalation
    if (waveTimer >= waveDuration) {
      waveTimer = 0;
      wave++;
      waveDuration = Math.max(15, 30 - wave * 2);
      difficulty = 1 + (wave - 1) * 0.3;
      spawnParticles(player.x, player.y - 30, '#f0abfc', 20, 150);
      spawnParticles(player.x, player.y - 18, '#fde68a', 8, 80);
      playPowerUp();
      playWaveSurge();
      wavePop = { n: wave, life: 1.4 };
      waveFlash = 1.3;  // energize lanes + ground with moonlight power (escalating relay feel)
      // Gift shards from the prism surge — immediate high-energy collect opportunity on wave up
      for (let i = 0; i < 2; i++) spawnShard();
    }

    // Score from survival
    score += Math.floor(dt * 10 * difficulty);
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('mprHighScore', String(highScore)); } catch (e) {}
    }

    // Combo timer
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) {
        combo = 0;
        comboMultiplier = 1;
      }
    }

    // Screen shake decay
    if (screenShake > 0) {
      screenShake -= dt * 5;
      screenShakeX = (Math.random() - 0.5) * screenShake * 8;
      screenShakeY = (Math.random() - 0.5) * screenShake * 8;
      if (screenShake < 0) { screenShake = 0; screenShakeX = 0; screenShakeY = 0; }
    }

    // Super mode
    if (superActive) {
      superTimer -= dt;
      superFlash = Math.max(0, superFlash - dt * 3);
      if (superTimer <= 0) {
        superActive = false;
        moonGauge = 0;
      }
    }

    // Player invincibility
    if (player.invincible) {
      player.invincibleTimer -= dt;
      player.transformFlash = Math.max(0, player.transformFlash - dt * 4);
      if (player.invincibleTimer <= 0) player.invincible = false;
    }
  } else {
    // Demo / start idle time
    gameTime += dt * 0.6;
  }

  player.glowPulse += dt * 3;

  // Player lane swap (smooth even in demo)
  const targetX = getLaneX(player.targetLane);
  const dx = targetX - player.x;
  player.x += dx * LANE_SWAP_SPEED * dt * 10;
  // Expressive lean: more on dash (forward), counter on jump apex, swish influence
  let baseRot = dx * 0.003;
  if (player.dashing) baseRot += 0.12 * (player.targetLane - player.lane);
  if (player.jumping) baseRot += Math.max(-0.18, Math.min(0.12, player.vy * 0.0006));
  player.rotation = baseRot * (player.dashing ? 1.6 : 1) + (player.dashing ? Math.sign(dx) * 0.09 : 0);

  // Player jump/dash physics (demo has gentle bob only)
  if (player.jumping && !isDemo) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    const groundY = getGroundY() - player.height;
    if (player.y >= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.jumping = false;
      player.grounded = true;
    }
  } else if (isDemo) {
    // idle bob on start screen
    const groundY = getGroundY() - player.height;
    player.y = groundY - 4 + Math.sin(gameTime * 1.7) * 3.5;
    player.vy = 0;
  }

  // Player dash
  if (player.dashing && !isDemo) {
    player.dashTimer -= dt;
    if (player.dashTimer <= 0) player.dashing = false;
  }

  // Spawn trail (demo light)
  if ((player.dashing || gameTime < 5) && !isDemo) {
    trailParticles.push({
      x: player.x - 15,
      y: player.y + player.height / 2,
      life: 1,
      size: 3 + Math.random() * 4
    });
  }

  // Update trail particles
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    const tSpeed = (player.dashing ? PLAYER_SPEED_BASE * DASH_BOOST * difficulty : PLAYER_SPEED_BASE * 0.6) * (isDemo ? 0.3 : 1);
    trailParticles[i].x -= tSpeed * dt;
    trailParticles[i].life -= dt * 2.5;
    if (trailParticles[i].life <= 0) trailParticles.splice(i, 1);
  }

  // Update stars (always, slower in demo)
  for (const star of stars) {
    const s = (player.dashing ? 3 : 1) * speedMul;
    star.x -= star.speed * 60 * dt * s;
    star.twinkle += dt * 2;
    if (star.x < -5) star.x = W + 5;
  }

  // Update buildings (parallax, always)
  const scrollSpeed = (player.dashing ? PLAYER_SPEED_BASE * DASH_BOOST : PLAYER_SPEED_BASE) * 0.6 * difficulty * speedMul;
  for (const b of buildings) {
    b.x -= b.parallax * scrollSpeed * dt;
    if (b.x + b.w < -20) b.x = W + 20 + Math.random() * 100;
  }
  for (const b of groundBuildings) {
    b.x -= b.parallax * scrollSpeed * dt * 0.7;
    if (b.x + b.w < -20) b.x = W + 20 + Math.random() * 80;
  }

  if (isDemo) {
    updateDemoAmbience(dt, speedMul);
    // allow pre-start lane preview (interactive first screen); otherwise keep centered for clean stable preview/screenshots
    if (gameTime > demoPreviewUntil && Math.abs(player.targetLane) > 0.06) player.targetLane = 0;
    return; // no full hazards/spawns/score/UI in demo — ambient echoes provide the "in action" verbs
  }

  // Update obstacles (playing only)
  const moveSpeed = scrollSpeed * (player.dashing ? DASH_BOOST : 1);
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.x -= moveSpeed * dt;
    if (obs.x < -60) { obstacles.splice(i, 1); continue; }

    // Collision check — deflect gives crisp feedback (jump over / dash through)
    if (!obs.hit && !player.invincible && !superActive) {
      const px = player.x - player.width/2, py = player.y;
      const ox = obs.x - obs.w/2, oy = obs.y;
      if (px < ox + obs.w && px + player.width > ox &&
          py < oy + obs.h && py + player.height > oy) {
        if (obs.type === 'shadow' && player.jumping && player.y < oy - 10) {
          obs.hit = true;
          deflectHazard(obs, 'jump');
        } else if (obs.type === 'shadow_ball' && player.dashing) {
          obs.hit = true;
          deflectHazard(obs, 'dash');
        } else {
          obs.hit = true;
          hitPlayer();
        }
      }
    }
  }

  // Update shards
  for (let i = shards.length - 1; i >= 0; i--) {
    const shard = shards[i];
    shard.x -= moveSpeed * dt;
    shard.rotation += dt * 3;
    shard.glow = (Math.sin(shard.rotation * 2) + 1) * 0.5;
    if (shard.x < -30) { shards.splice(i, 1); continue; }

    // Collection check
    if (!shard.collected) {
      const dx2 = player.x - shard.x;
      const dy2 = (player.y + player.height/2) - shard.y;
      const dist = Math.sqrt(dx2*dx2 + dy2*dy2);
      if (dist < 48) {
        shard.collected = true;
        collectShard(shard);
        shards.splice(i, 1);
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update lane swish ribbons (short life, drift with motion)
  for (let i = laneSwishes.length - 1; i >= 0; i--) {
    const s = laneSwishes[i];
    s.life -= dt * 3.2;
    s.x -= (player.dashing ? 380 : 220) * dt; // trail behind
    if (s.life <= 0) laneSwishes.splice(i, 1);
  }

  // Update deflect slashes (bright geometry arcs)
  for (let i = deflectSlashes.length - 1; i >= 0; i--) {
    const s = deflectSlashes[i];
    s.life -= dt * 2.8;
    s.x -= 260 * dt;
    if (s.life <= 0) deflectSlashes.splice(i, 1);
  }

  // Update rising score pops (collect/deflect feedback — high energy, immediately readable)
  for (let i = scorePops.length - 1; i >= 0; i--) {
    const p = scorePops[i];
    p.y -= 42 * dt;
    p.life -= dt * 1.15;
    if (p.life <= 0) scorePops.splice(i, 1);
  }
  if (wavePop) {
    wavePop.life -= dt;
    if (wavePop.life <= 0) wavePop = null;
  }
  if (waveFlash > 0) waveFlash = Math.max(0, waveFlash - dt);  // decay the wave power surge visual

  // Spawning
  spawnTimer += dt;
  const shardInterval = Math.max(0.5, 2.5 - wave * 0.15);
  const obstacleInterval = Math.max(0.6, 2.0 - wave * 0.12);

  if (spawnTimer >= shardInterval) {
    spawnTimer = 0;
    spawnShard();
  }
  if (obstacleSpawnTimer >= obstacleInterval) {
    obstacleSpawnTimer = 0;
    spawnObstacle();
  }
}

function collectShard(shard) {
  combo++;
  comboTimer = 2.5;
  comboMultiplier = 1 + Math.floor(combo / 5) * 0.5;
  const points = Math.floor(10 * comboMultiplier);
  score += points;
  scorePops.push({ x: shard.x, y: shard.y - 8, val: points, life: 1.18, color: '#fde68a' });
  if (score > highScore) {
    const prevBest = highScore;
    highScore = score;
    try { localStorage.setItem('mprHighScore', String(highScore)); } catch (e) {}
    if (score - prevBest > 4) {
      scorePops.push({ x: shard.x + 8, y: shard.y - 20, label: '★ BEST', life: 1.22, color: '#fef08c' });
      spawnParticles(shard.x, shard.y - 12, '#fde68a', 12, 72);
      playTone(1320, 0.12, 'sine', 0.16);
      playTone(1760, 0.18, 'sine', 0.1, 0.06);
    }
  }
  const prevGauge = moonGauge;
  moonGauge = Math.min(MOON_MAX, moonGauge + (3 + combo * 0.5));
  if (prevGauge < MOON_MAX && moonGauge >= MOON_MAX) {
    // Gauge full — ritual ready burst (celestial crescents + chime)
    playPowerUp();
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2;
      particles.push({
        x: player.x, y: player.y - 10,
        vx: Math.cos(ang) * (70 + Math.random()*30),
        vy: Math.sin(ang) * (50 + Math.random()*20) - 20,
        life: 0.9,
        decay: 0.9,
        size: 3.2 + Math.random() * 1.4,
        color: i % 2 ? '#fde68a' : '#f0abfc',
        gravity: 40
      });
    }
    spawnParticles(player.x, player.y - 18, '#fde68a', 12, 78);
  }

  spawnParticles(shard.x, shard.y, shard.color, 28, 175);
  // Extra prism / crescent sparkles on collect (stronger hit/reward feedback — bright readable high-energy)
  for (let i = 0; i < 7; i++) {
    particles.push({
      x: shard.x, y: shard.y,
      vx: (Math.random() - 0.5) * 138,
      vy: -52 - Math.random() * 38,
      life: 0.9,
      decay: 1.35,
      size: 3.8 + Math.random() * 2.1,
      color: '#fde68a',
      gravity: 90
    });
  }
  playCollect();
  if (combo > 0 && combo % 5 === 0) {
    playCombo(Math.min(combo / 5, 10));
    showComboText(combo);
  }

  // Check super activation
  if (moonGauge >= MOON_MAX && !superActive) {
    activateSuper();
  }
}

function activateSuper() {
  superActive = true;
  superTimer = 5;
  superFlash = 1;
  moonGauge = 0;
  player.invincible = true;
  player.invincibleTimer = 5.5;
  player.transformFlash = 1;
  spawnParticles(player.x, player.y + player.height/2, '#f0abfc', 48, 280);
  spawnParticles(player.x, player.y + player.height/2, '#e9d5ff', 36, 220);
  playPowerUp();
  playSuperTheme();
}

function hitPlayer() {
  screenShake = 1;
  playHit();
  spawnParticles(player.x, player.y + player.height/2, '#ef4444', 20, 170);
  combo = 0;
  comboTimer = 0;
  comboMultiplier = 1;
  moonGauge = Math.max(0, moonGauge - 15);
  player.invincible = true;
  player.invincibleTimer = 1.5;
  player.transformFlash = 0.5;

  if (moonGauge <= 0) {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('mprHighScore', String(highScore)); } catch (e) {}
    }
    stopMusicOnEnd();
    state = 'gameover';
  }
}

function showComboText(comboCount) {
  const el = document.getElementById('comboDisplay');
  el.textContent = comboCount + 'x MOON COMBO!';
  el.style.opacity = 1;
  el.style.transition = 'opacity 0.3s, transform 0.3s';
  el.style.transform = 'translate(-50%,-50%) scale(1)';
  setTimeout(() => { el.style.opacity = 0; el.style.transform = 'translate(-50%,-50%) scale(1.3)'; }, 800);
}

// Deflect feedback — makes "deflect shadow hazards" feel crisp and rewarding (theatrical precision per house style)
function deflectHazard(obs, kind) {
  const bonus = 8;
  score += bonus;
  scorePops.push({ x: obs.x, y: (obs.y || player.y) - 10, val: bonus, life: 0.96, color: '#93c5fd' });
  if (score > highScore) {
    const prevBest = highScore;
    highScore = score;
    try { localStorage.setItem('mprHighScore', String(highScore)); } catch (e) {}
    if (score - prevBest > 4) {
      scorePops.push({ x: obs.x + 6, y: (obs.y || player.y) - 18, label: '★ BEST', life: 1.15, color: '#fef08c' });
      spawnParticles(obs.x, (obs.y || player.y) - 10, '#fde68a', 11, 68);
      playTone(1320, 0.12, 'sine', 0.16);
      playTone(1760, 0.18, 'sine', 0.1, 0.06);
    }
  }
  const prevG = moonGauge;
  moonGauge = Math.min(MOON_MAX, moonGauge + 5);
  if (prevG < MOON_MAX && moonGauge >= MOON_MAX) {
    playPowerUp();
    // Ritual ready burst (celestial crescents) — deflect that caps gauge also triggers super for satisfying payoff
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2;
      particles.push({
        x: player.x, y: player.y - 10,
        vx: Math.cos(ang) * 95,
        vy: Math.sin(ang) * 55 - 40,
        life: 0.9,
        decay: 1.6,
        size: 3.6 + Math.random() * 1.8,
        color: (i % 2 === 0 ? '#fde68a' : '#f0abfc'),
        gravity: 0
      });
    }
    activateSuper(); // auto super on the deflect that completed the Moon Prism — high-energy transformation reward
  }
  spawnParticles(obs.x, obs.y + (obs.h || 30)/2, kind === 'dash' ? '#93c5fd' : '#f0abfc', 15, 100);
  // Extra sacred-geometry sparkles (stronger hit/reward feedback)
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: obs.x + (Math.random() - 0.5) * 10,
      y: obs.y + (obs.h || 30)/2,
      vx: (Math.random() - 0.5) * 112,
      vy: -36 - Math.random() * 40,
      life: 0.96,
      decay: 1.0 + Math.random() * 0.35,
      size: 3.0 + Math.random() * 2.2,
      color: '#fde68a',
      gravity: 70
    });
  }
  playDeflect(kind);
  // Spawn bright sacred-geometry crescent slash (theatrical deflect satisfaction)
  deflectSlashes.push({
    x: obs.x,
    y: obs.y + (obs.h || 28) * 0.5,
    life: 0.32,
    kind,
    rot: (kind === 'dash' ? -0.6 : 0.7) + (Math.random() - 0.5) * 0.4
  });
}

// Lane swish ribbon (quick living fabric trail on swap — body as instrument, ribbons have will)
function spawnLaneSwish(x, y, dir) {
  laneSwishes.push({
    x, y,
    dir,            // -1 left, +1 right
    life: 0.28,
    phase: Math.random() * Math.PI * 2
  });
}

// Trigger swish from input sites (keeps one place for effect)
function changeLane(dir) {
  const before = player.targetLane;
  if (dir < 0 && player.targetLane > -1) player.targetLane--;
  else if (dir > 0 && player.targetLane < 1) player.targetLane++;
  if (player.targetLane !== before && (state === 'playing' || state === 'start')) {
    spawnLaneSwish(player.x, player.y + player.height * 0.4, dir);
    if (state === 'start') demoPreviewUntil = gameTime + 1.35; // window for interactive lane preview on first screen
  }
}

// ========== DRAW ==========
function draw() {
  uctx.clearRect(0, 0, W, H);
  gctx.clearRect(0, 0, W, H);

  // Screen shake offset
  gctx.save();
  gctx.translate(screenShakeX, screenShakeY);

  // Sky gradient
  const skyGrad = gctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0b0b2a');
  skyGrad.addColorStop(0.4, '#1a1040');
  skyGrad.addColorStop(0.7, '#2d1b69');
  skyGrad.addColorStop(1, '#0f172a');
  gctx.fillStyle = skyGrad;
  gctx.fillRect(0, 0, W, H);

  // Moon — authored detailed (craters, maria, ritual rays for house moonlight material)
  const moonX = W * 0.78, moonY = H * 0.12, moonR = Math.min(W, H) * 0.085;
  const mPulse = 1.0 + Math.sin(gameTime * 0.7) * 0.015;
  gctx.save();
  gctx.shadowColor = '#fde68a';
  gctx.shadowBlur = 46 + Math.sin(gameTime) * 12;
  gctx.fillStyle = '#fef3c7';
  gctx.beginPath();
  gctx.arc(moonX, moonY, moonR * mPulse, 0, Math.PI * 2);
  gctx.fill();
  // Soft inner maria (crater seas, deliberate not random blobs)
  gctx.fillStyle = 'rgba(234, 179, 8, 0.22)';
  gctx.beginPath(); gctx.arc(moonX - moonR*0.22, moonY + moonR*0.08, moonR*0.32, 0, Math.PI*2); gctx.fill();
  gctx.beginPath(); gctx.arc(moonX + moonR*0.18, moonY - moonR*0.18, moonR*0.22, 0, Math.PI*2); gctx.fill();
  gctx.beginPath(); gctx.arc(moonX - moonR*0.08, moonY - moonR*0.32, moonR*0.18, 0, Math.PI*2); gctx.fill();
  // Subtle crater rings
  gctx.strokeStyle = 'rgba(180, 140, 40, 0.25)';
  gctx.lineWidth = 1.2;
  for (let c=0; c<3; c++) {
    gctx.beginPath();
    gctx.arc(moonX + (c-1)*moonR*0.18, moonY + (c%2? -1:1)*moonR*0.12, moonR*(0.12 + c*0.04), 0, Math.PI*2);
    gctx.stroke();
  }
  gctx.restore();
  // Crescent terminator shadow (classic moon)
  gctx.fillStyle = '#0b0b2a';
  gctx.beginPath();
  gctx.arc(moonX + moonR * 0.28, moonY - moonR * 0.06, moonR * 0.86, 0, Math.PI * 2);
  gctx.fill();
  // Ritual outer rays (intensify on super / wave for music-led visual tie)
  const rayA = superActive ? 0.55 : (waveFlash > 0 ? 0.38 : 0.18);
  gctx.strokeStyle = `rgba(253,230,138,${rayA})`;
  gctx.lineWidth = 1.6;
  for (let r=0; r<8; r++) {
    const a = (r / 8) * Math.PI * 2 + gameTime * 0.2;
    const rx = moonX + Math.cos(a) * (moonR + 6);
    const ry = moonY + Math.sin(a) * (moonR + 6);
    gctx.beginPath();
    gctx.moveTo(moonX + Math.cos(a) * moonR * 0.7, moonY + Math.sin(a) * moonR * 0.7);
    gctx.lineTo(rx + Math.cos(a) * (superActive ? 28 : 14), ry + Math.sin(a) * (superActive ? 28 : 14));
    gctx.stroke();
  }

  // Stars
  for (const star of stars) {
    const alpha = 0.4 + Math.sin(star.twinkle) * 0.4;
    gctx.fillStyle = `rgba(255,255,255,${alpha})`;
    gctx.beginPath();
    gctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    gctx.fill();
  }

  // Background buildings (parallax layer 1) — authored city with spires, rooftop ribbons, constellation windows
  for (const b of buildings) {
    gctx.fillStyle = b.color;
    const by = getGroundY() - b.h * 0.6;
    gctx.fillRect(b.x, by, b.w, b.h * 0.6);
    // Spire or dome cap (observatory / sacred geometry tie)
    if (b.isSpire) {
      gctx.fillStyle = '#1f2544';
      gctx.beginPath();
      gctx.moveTo(b.x + b.w*0.5, by - b.h*0.18);
      gctx.lineTo(b.x + b.w*0.18, by);
      gctx.lineTo(b.x + b.w*0.82, by);
      gctx.closePath();
      gctx.fill();
      // crescent finial
      gctx.strokeStyle = 'rgba(224,242,255,0.5)';
      gctx.lineWidth = 1.5;
      gctx.beginPath();
      gctx.arc(b.x + b.w*0.5, by - b.h*0.22, b.w*0.12, -0.9, 0.9);
      gctx.stroke();
    }
    // Windows — deliberate patterns + occasional prism flicker on wave
    const winCols = 3, winRows = Math.floor(b.h * 0.6 / 18);
    for (let wy = 0; wy < winRows; wy++) {
      for (let wx = 0; wx < winCols; wx++) {
        const flick = waveFlash > 0.2 && ((wx+wy)%2===0) ? 0.18 : 0;
        if (Math.sin(wx*7+wy*13+b.x*0.01) > 0) {
          gctx.fillStyle = `rgba(250,204,21,${0.32 + flick})`;
          gctx.fillRect(b.x + 4 + wx * (b.w-8)/winCols,
                        by + 8 + wy*18,
                        6, 8);
        }
      }
    }
    // Rooftop living ribbon (house fabric will, subtle)
    if (b.hasRibbon) {
      const rx = b.x + b.w*0.3 + Math.sin(gameTime*1.1 + b.lampPhase)*3;
      gctx.strokeStyle = 'rgba(249,168,212,0.35)';
      gctx.lineWidth = 1.2;
      gctx.beginPath();
      gctx.moveTo(b.x + 2, by + 2);
      gctx.quadraticCurveTo(rx, by - 6, b.x + b.w - 4, by + 4);
      gctx.stroke();
    }
  }

  // Ground buildings (parallax layer 2) — lamps, balconies, richer rhythm
  for (const b of groundBuildings) {
    gctx.fillStyle = b.color;
    const by = getGroundY() - b.h;
    gctx.fillRect(b.x, by, b.w, b.h);
    const winCols = Math.max(1, Math.floor(b.w / 16));
    for (let wy = 0; wy < 3; wy++) {
      for (let wx = 0; wx < winCols; wx++) {
        if (Math.sin(wx*11+wy*7+b.x*0.02) > 0.2) {
          gctx.fillStyle = 'rgba(250,204,21,0.4)';
          gctx.fillRect(b.x + 3 + wx * (b.w-6)/winCols,
                        by + 6 + wy*16,
                        5, 7);
        }
      }
    }
    // Street lamp (authored glow, sways, pink-gold moonlight)
    if (b.hasLamp) {
      const lx = b.x + b.w * 0.22 + Math.sin(gameTime * 1.3 + b.lampPhase) * 1.5;
      const ly = by + 3;
      gctx.fillStyle = '#2a2a4a';
      gctx.fillRect(lx - 1.5, ly, 3, b.h * 0.55);
      // lamp head
      gctx.fillStyle = '#3a2f5a';
      gctx.fillRect(lx - 4, ly - 5, 8, 5);
      // glow
      const lg = 0.5 + Math.sin(gameTime * 2.5 + b.lampPhase) * 0.25;
      gctx.fillStyle = `rgba(253,224,71,${0.45 * lg})`;
      gctx.beginPath();
      gctx.arc(lx, ly - 2, 7, 0, Math.PI*2);
      gctx.fill();
      gctx.fillStyle = `rgba(249,168,212,${0.25 * lg})`;
      gctx.beginPath();
      gctx.arc(lx, ly - 2, 11, 0, Math.PI*2);
      gctx.fill();
    }
  }

  // Ground
  const groundY = getGroundY();
  gctx.fillStyle = '#1a1a3e';
  gctx.fillRect(0, groundY, W, H - groundY);
  // Lane markings
  for (const lane of LANES) {
    const lx = getLaneX(lane);
    const laneAlpha = waveFlash > 0 ? 0.15 + waveFlash * 0.55 : 0.15;
    gctx.strokeStyle = `rgba(168,85,247,${laneAlpha})`;
    gctx.lineWidth = 2;
    gctx.setLineDash([20, 20]);
    gctx.lineDashOffset = -gameTime * 60;
    gctx.beginPath();
    gctx.moveTo(lx, groundY + 5);
    gctx.lineTo(lx, H);
    gctx.stroke();
    gctx.setLineDash([]);
  }
  // Ground line
  gctx.strokeStyle = 'rgba(236,72,153,0.3)';
  gctx.lineWidth = 2;
  gctx.beginPath();
  gctx.moveTo(0, groundY);
  gctx.lineTo(W, groundY);
  gctx.stroke();
  // Wave power surge: bright gold relay lines on ground (escalation celebration, high-energy readable)
  if (waveFlash > 0) {
    const fa = Math.max(0.18, waveFlash * 0.65);
    gctx.strokeStyle = `rgba(253,230,138,${fa})`;
    gctx.lineWidth = 2.8;
    gctx.beginPath();
    gctx.moveTo(0, groundY);
    gctx.lineTo(W, groundY);
    gctx.stroke();
    // Subtle bright lane center accents
    for (const lane of LANES) {
      const lx = getLaneX(lane);
      gctx.beginPath();
      gctx.moveTo(lx - 3, groundY + 8);
      gctx.lineTo(lx + 3, groundY + 8);
      gctx.stroke();
    }
  }

  // Super ritual ground aura (living power flows into lanes)
  if (superActive) {
    gctx.strokeStyle = `rgba(249,168,212,${0.35 + Math.sin(gameTime*4)*0.15})`;
    gctx.lineWidth = 3;
    gctx.beginPath();
    gctx.moveTo(0, groundY + 1);
    gctx.lineTo(W, groundY + 1);
    gctx.stroke();
  }

  if (state === 'playing' || state === 'gameover' || state === 'start') {
    drawPlayer();
    drawShards();
    drawObstacles();
    drawTrailParticles();
    drawLaneSwishes();
    drawDeflectSlashes();
    drawParticles();
    drawScorePops();
    drawWavePop();
    drawSuperEffects();
  }

  gctx.restore();

  // UI (on uiCanvas, no shake)
  if (state === 'playing') drawUI();
}

function drawPlayer() {
  const px = player.x, py = player.y;
  const pw = player.width, ph = player.height;

  gctx.save();
  gctx.translate(px, py + ph/2);
  gctx.rotate(player.rotation);

  // Glow effect (larger, more legible per playtest)
  const glowSize = 28 + Math.sin(player.glowPulse) * 6;
  const glowColor = superActive ? '#f0abfc' : (player.invincible ? '#fde68a' : '#c084fc');
  gctx.shadowColor = glowColor;
  gctx.shadowBlur = superActive ? 34 : glowSize;

  // Transformation flash (ritual burst)
  if (player.transformFlash > 0) {
    gctx.fillStyle = `rgba(255,255,255,${player.transformFlash * 0.7})`;
    gctx.fillRect(-pw-10, -ph-10, pw*2+20, ph*2+20);
  }

  // === AUTHORED SAILOR MOON SILHOUETTE (detailed fuku, odango, sacred tech) ===
  // Back bow / cape base (living fabric)
  gctx.fillStyle = '#9f1239';
  gctx.beginPath();
  gctx.moveTo(-pw*0.22, -ph*0.02);
  gctx.quadraticCurveTo(-pw*0.48, ph*0.22, -pw*0.36, ph*0.48);
  gctx.lineTo(pw*0.36, ph*0.48);
  gctx.quadraticCurveTo(pw*0.48, ph*0.22, pw*0.22, -ph*0.02);
  gctx.closePath();
  gctx.fill();

  // Main body / fuku (pink)
  gctx.fillStyle = '#ec4899';
  gctx.beginPath();
  gctx.moveTo(-pw*0.32, -ph*0.12);
  gctx.quadraticCurveTo(-pw*0.52, ph*0.12, -pw*0.38, ph*0.46);
  gctx.lineTo(pw*0.38, ph*0.46);
  gctx.quadraticCurveTo(pw*0.52, ph*0.12, pw*0.32, -ph*0.12);
  gctx.closePath();
  gctx.fill();

  // Sailor collar (white with stripes — classic)
  gctx.fillStyle = '#f8fafc';
  gctx.beginPath();
  gctx.moveTo(-pw*0.34, -ph*0.18);
  gctx.lineTo(0, ph*0.06);
  gctx.lineTo(pw*0.34, -ph*0.18);
  gctx.lineTo(pw*0.22, -ph*0.32);
  gctx.lineTo(0, -ph*0.14);
  gctx.lineTo(-pw*0.22, -ph*0.32);
  gctx.closePath();
  gctx.fill();
  // collar stripes
  gctx.strokeStyle = '#e11d48';
  gctx.lineWidth = Math.max(1, pw*0.03);
  gctx.beginPath();
  gctx.moveTo(-pw*0.18, -ph*0.22);
  gctx.lineTo(0, -ph*0.02);
  gctx.lineTo(pw*0.18, -ph*0.22);
  gctx.stroke();

  // Chest brooch (sacred geometry: pink heart-crescent)
  gctx.fillStyle = '#f9a8d4';
  gctx.beginPath();
  gctx.arc(0, -ph*0.02, pw*0.09, 0, Math.PI*2);
  gctx.fill();
  gctx.fillStyle = '#ec4899';
  gctx.beginPath();
  gctx.arc(0, -ph*0.01, pw*0.055, 0, Math.PI*2);
  gctx.fill();
  // small inner crescent
  gctx.strokeStyle = '#fde68a';
  gctx.lineWidth = 1.6;
  gctx.beginPath();
  gctx.arc(0, -ph*0.015, pw*0.035, -0.9, 0.9);
  gctx.stroke();

  // Head (skin)
  gctx.fillStyle = '#fce7f3';
  gctx.beginPath();
  gctx.arc(0, -ph*0.30, pw*0.28, 0, Math.PI*2);
  gctx.fill();

  // Odango buns (iconic, large for legibility)
  gctx.fillStyle = superActive ? '#fde68a' : '#a855f7';
  gctx.beginPath();
  gctx.arc(-pw*0.26, -ph*0.38, pw*0.11, 0, Math.PI*2);
  gctx.fill();
  gctx.beginPath();
  gctx.arc(pw*0.26, -ph*0.38, pw*0.11, 0, Math.PI*2);
  gctx.fill();
  // bun highlights
  gctx.fillStyle = superActive ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.2)';
  gctx.beginPath(); gctx.arc(-pw*0.22, -ph*0.40, pw*0.05, 0, Math.PI*2); gctx.fill();
  gctx.beginPath(); gctx.arc(pw*0.30, -ph*0.40, pw*0.05, 0, Math.PI*2); gctx.fill();

  // Front hair + long back hair (flowing)
  gctx.fillStyle = superActive ? '#fde68a' : '#a855f7';
  gctx.beginPath();
  gctx.arc(0, -ph*0.34, pw*0.30, Math.PI, Math.PI*2);
  gctx.fill();
  // long flowing back (two strands)
  gctx.beginPath();
  gctx.moveTo(-pw*0.22, -ph*0.28);
  gctx.quadraticCurveTo(-pw*0.58, -ph*0.05, -pw*0.66, ph*0.18);
  gctx.quadraticCurveTo(-pw*0.48, ph*0.32, -pw*0.28, ph*0.22);
  gctx.lineTo(-pw*0.22, -ph*0.12);
  gctx.fill();
  gctx.beginPath();
  gctx.moveTo(pw*0.22, -ph*0.28);
  gctx.quadraticCurveTo(pw*0.58, -ph*0.05, pw*0.66, ph*0.18);
  gctx.quadraticCurveTo(pw*0.48, ph*0.32, pw*0.28, ph*0.22);
  gctx.lineTo(pw*0.22, -ph*0.12);
  gctx.fill();

  // Tiara + gem (sacred tech, scales up)
  gctx.fillStyle = superActive ? '#fde68a' : '#e2e8f0';
  gctx.beginPath();
  gctx.arc(0, -ph*0.40, Math.max(8, pw*0.14), 0, Math.PI*2);
  gctx.fill();
  gctx.fillStyle = superActive ? '#f0abfc' : '#c084fc';
  gctx.beginPath();
  gctx.arc(0, -ph*0.40, Math.max(3.5, pw*0.055), 0, Math.PI*2);
  gctx.fill();

  // Eyes (larger, expressive, high contrast for readability)
  const ex = Math.max(7, pw*0.115);
  const eyR = Math.max(4, pw*0.075);
  gctx.fillStyle = superActive ? '#fde68a' : '#ec4899';
  gctx.beginPath();
  gctx.ellipse(-ex, -ph*0.30, eyR, eyR*1.2, 0, 0, Math.PI*2);
  gctx.fill();
  gctx.beginPath();
  gctx.ellipse(ex, -ph*0.30, eyR, eyR*1.2, 0, 0, Math.PI*2);
  gctx.fill();
  // shine
  gctx.fillStyle = '#fff';
  gctx.beginPath();
  gctx.arc(-ex*0.82, -ph*0.315, Math.max(1.6, pw*0.028), 0, Math.PI*2);
  gctx.fill();
  gctx.beginPath();
  gctx.arc(ex*1.08, -ph*0.315, Math.max(1.6, pw*0.028), 0, Math.PI*2);
  gctx.fill();

  // Mouth (small, sincere)
  gctx.strokeStyle = '#9f1239';
  gctx.lineWidth = 1.2;
  gctx.beginPath();
  gctx.arc(0, -ph*0.22, pw*0.04, 0.2, Math.PI-0.2);
  gctx.stroke();

  // Arms / gloves (white with red trim)
  gctx.fillStyle = '#f8fafc';
  gctx.fillRect(-pw*0.42, -ph*0.08, pw*0.12, ph*0.22);
  gctx.fillRect(pw*0.30, -ph*0.08, pw*0.12, ph*0.22);
  gctx.fillStyle = '#e11d48';
  gctx.fillRect(-pw*0.42, -ph*0.08, pw*0.12, 4);
  gctx.fillRect(pw*0.30, -ph*0.08, pw*0.12, 4);

  // Pleated skirt (explicit folds for theatrical physicality)
  gctx.fillStyle = '#9f1239';
  gctx.beginPath();
  gctx.moveTo(-pw*0.38, ph*0.22);
  gctx.lineTo(-pw*0.28, ph*0.52);
  gctx.lineTo(-pw*0.10, ph*0.48);
  gctx.lineTo(0, ph*0.54);
  gctx.lineTo(pw*0.10, ph*0.48);
  gctx.lineTo(pw*0.28, ph*0.52);
  gctx.lineTo(pw*0.38, ph*0.22);
  gctx.closePath();
  gctx.fill();
  // fold lines
  gctx.strokeStyle = '#7f1d1d';
  gctx.lineWidth = 1.0;
  for (let f=-2; f<=2; f++) {
    gctx.beginPath();
    gctx.moveTo(f * pw*0.09, ph*0.24);
    gctx.lineTo(f * pw*0.07, ph*0.50);
    gctx.stroke();
  }

  // Legs / boots (red with white trim, animated)
  const legPhase = Math.sin(gameTime * 8) * (player.jumping ? 0.6 : 1);
  gctx.fillStyle = '#e11d48';
  gctx.fillRect(-7, ph*0.34, 6, ph*0.20 + legPhase*2);
  gctx.fillRect(2, ph*0.34, 6, ph*0.20 - legPhase*2);
  // white boot trim
  gctx.fillStyle = '#f8fafc';
  gctx.fillRect(-7, ph*0.34, 6, 3);
  gctx.fillRect(2, ph*0.34, 6, 3);

  // Moon stick / bracelet accent (scaled legible)
  gctx.fillStyle = '#e2e8f0';
  gctx.fillRect(pw*0.28, -ph*0.02, pw*0.10, pw*0.20);
  gctx.fillStyle = '#fde68a';
  gctx.beginPath();
  gctx.arc(pw*0.33, ph*0.08, pw*0.05, 0, Math.PI*2);
  gctx.fill();

  gctx.restore();
}

function drawShards() {
  for (const s of shards) {
    gctx.save();
    gctx.translate(s.x, s.y);
    gctx.rotate(s.rotation);

    if (s.ambient) {
      gctx.globalAlpha = 0.68;
      gctx.shadowBlur = (12 + s.glow * 10) * 0.7;
    } else {
      gctx.shadowBlur = 12 + s.glow * 10;
    }
    gctx.shadowColor = s.color;

    // Richer authored prism shard (multi-facet + inner crescent + radial for "prism relay" clarity)
    gctx.fillStyle = s.color;
    // Outer 8-point star/diamond hybrid
    gctx.beginPath();
    for (let k=0; k<8; k++) {
      const a = (k/8)*Math.PI*2 + (k%2?0.18:0);
      const r = (k%2) ? s.size*0.55 : s.size;
      gctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    gctx.closePath();
    gctx.fill();
    // Inner facet (brighter core)
    gctx.fillStyle = 'rgba(255,255,255,0.65)';
    gctx.beginPath();
    for (let k=0; k<4; k++) {
      const a = (k/4)*Math.PI*2 + 0.4;
      gctx.lineTo(Math.cos(a)*s.size*0.42, Math.sin(a)*s.size*0.42);
    }
    gctx.closePath();
    gctx.fill();
    // Sacred inner crescent (ties to tiara/moon)
    gctx.strokeStyle = 'rgba(255,255,255,0.85)';
    gctx.lineWidth = Math.max(1.5, s.size*0.09);
    gctx.beginPath();
    gctx.arc(0, s.size*0.05, s.size*0.32, -1.0, 1.0);
    gctx.stroke();
    // Edge highlight sweep
    gctx.strokeStyle = 'rgba(224,242,255,0.7)';
    gctx.lineWidth = Math.max(1, s.size * 0.07);
    gctx.beginPath();
    gctx.moveTo(-s.size*0.22, -s.size*0.38);
    gctx.lineTo(s.size*0.16, s.size*0.28);
    gctx.stroke();

    gctx.globalAlpha = 1;
    gctx.restore();
  }
}

function drawObstacles() {
  for (const obs of obstacles) {
    gctx.save();
    gctx.translate(obs.x, obs.y + obs.h/2);

    const isAmbient = !!obs.ambient;
    if (isAmbient) gctx.globalAlpha = 0.55;

    if (obs.type === 'shadow') {
      // Shadow blob creature
      gctx.shadowColor = '#4c1d95';
      gctx.shadowBlur = isAmbient ? 8 : 15;
      gctx.fillStyle = '#1e1040';
      gctx.beginPath();
      gctx.ellipse(0, 0, obs.w/2, obs.h/2, 0, 0, Math.PI*2);
      gctx.fill();
      // Shadow spikes
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 + gameTime * 2;
        const sx = Math.cos(angle) * obs.w * 0.6;
        const sy = Math.sin(angle) * obs.h * 0.5;
        gctx.beginPath();
        gctx.moveTo(sx - 3, sy);
        gctx.lineTo(sx + Math.cos(angle)*8, sy + Math.sin(angle)*10);
        gctx.lineTo(sx + 3, sy);
        gctx.fill();
      }
      // Eyes (strong red warning for avoid; fainter for ambient echo on first screen)
      gctx.shadowBlur = 0;
      const eyeA = isAmbient ? 0.58 : 1;
      const eyeR = isAmbient ? 2.8 : 3.6;
      for (let e = 0; e < obs.eyes; e++) {
        const ex = -8 + e * 8;
        gctx.fillStyle = `rgba(239,68,68,${eyeA})`;
        gctx.beginPath();
        gctx.arc(ex, -4, eyeR, 0, Math.PI*2);
        gctx.fill();
        gctx.fillStyle = `rgba(251,191,36,${eyeA})`;
        gctx.beginPath();
        gctx.arc(ex, -4, eyeR*0.48, 0, Math.PI*2);
        gctx.fill();
      }
      // Threat rim for non-ambient (clarifies "avoid this" at a glance)
      if (!isAmbient) {
        gctx.strokeStyle = 'rgba(248,113,113,0.75)';
        gctx.lineWidth = 2.2;
        gctx.beginPath();
        gctx.ellipse(0, 0, obs.w/2 + 4, obs.h/2 + 3, 0, 0, Math.PI*2);
        gctx.stroke();
      }
    } else if (obs.type === 'shadow_ball') {
      gctx.shadowColor = '#4c1d95';
      gctx.shadowBlur = isAmbient ? 10 : 20;
      gctx.fillStyle = '#1e1040';
      gctx.beginPath();
      gctx.arc(0, 0, obs.w/2, 0, Math.PI*2);
      gctx.fill();
      // Orbital rings
      gctx.strokeStyle = 'rgba(139,92,246,0.5)';
      gctx.lineWidth = 2;
      gctx.beginPath();
      gctx.ellipse(0, 0, obs.w/1.2, obs.h/3, gameTime, 0, Math.PI*2);
      gctx.stroke();
      // Eye (stronger red for avoid clarity)
      gctx.fillStyle = isAmbient ? 'rgba(239,68,68,0.65)' : '#ef4444';
      gctx.beginPath();
      gctx.arc(0, 0, isAmbient ? 3.2 : 4.6, 0, Math.PI*2);
      gctx.fill();
    } else if (obs.type === 'shadow_spike') {
      gctx.shadowColor = '#4c1d95';
      gctx.shadowBlur = isAmbient ? 6 : 12;
      gctx.fillStyle = '#1e1040';
      for (let i = 0; i < 3; i++) {
        const sx = (i - 1) * 10;
        gctx.beginPath();
        gctx.moveTo(sx, obs.h/2);
        gctx.lineTo(sx - 8, -obs.h/2);
        gctx.lineTo(sx + 8, -obs.h/2);
        gctx.closePath();
        gctx.fill();
      }
      gctx.fillStyle = '#ef4444';
      gctx.beginPath();
      gctx.arc(0, -obs.h/2 + 5, 4, 0, Math.PI*2);
      gctx.fill();
    }

    gctx.globalAlpha = 1;
    gctx.restore();
  }
}

function drawTrailParticles() {
  for (const p of trailParticles) {
    const alpha = p.life * 0.5;
    const color = superActive ? `rgba(240,171,252,${alpha})` : `rgba(192,132,252,${alpha})`;
    gctx.fillStyle = color;
    gctx.beginPath();
    gctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    gctx.fill();
  }
}

function drawLaneSwishes() {
  for (const s of laneSwishes) {
    const a = Math.max(0.08, s.life * 1.6);
    gctx.save();
    gctx.globalAlpha = a;
    gctx.strokeStyle = s.dir > 0 ? '#f9a8d4' : '#e0aaff';
    gctx.lineWidth = 2.2;
    gctx.shadowColor = '#c026ff';
    gctx.shadowBlur = 6;
    const len = 18 + (1 - s.life) * 14;
    const cy = s.y + Math.sin(gameTime * 18 + s.phase) * 3;
    gctx.beginPath();
    gctx.moveTo(s.x - (s.dir > 0 ? 0 : len), cy - 2);
    gctx.quadraticCurveTo(
      s.x + s.dir * len * 0.4, cy + Math.sin(s.phase) * 4,
      s.x + s.dir * len, cy + 1
    );
    gctx.stroke();
    gctx.restore();
  }
  gctx.globalAlpha = 1;
}

function drawDeflectSlashes() {
  for (const s of deflectSlashes) {
    const a = Math.max(0.1, s.life * 1.8);
    gctx.save();
    gctx.translate(s.x, s.y);
    gctx.rotate(s.rot + (1 - s.life) * 0.4 * Math.sign(s.rot));
    gctx.globalAlpha = a;
    gctx.strokeStyle = '#fde68a';
    gctx.lineWidth = 5.2;
    gctx.shadowColor = '#f0abfc';
    gctx.shadowBlur = 20;
    // Bright crescent geometry (sacred, high-energy deflect) — larger/stronger for legibility + reward pop
    gctx.beginPath();
    gctx.arc(0, 0, 26, -1.15, 1.15);
    gctx.stroke();
    gctx.lineWidth = 2.6;
    gctx.beginPath();
    gctx.arc(0, 0, 17, -0.95, 0.95);
    gctx.stroke();
    gctx.restore();
  }
  gctx.globalAlpha = 1;
}

function drawScorePops() {
  // Rising +N labels for shard collects and successful deflects (arcade-satisfying, high-energy, no clutter)
  gctx.textAlign = 'center';
  for (const p of scorePops) {
    const a = Math.max(0.15, p.life);
    gctx.globalAlpha = a;
    gctx.fillStyle = p.color;
    gctx.font = `bold ${Math.min(22, W * 0.046)}px sans-serif`;
    gctx.shadowColor = '#1e1135';
    gctx.shadowBlur = 6;
    const txt = p.label ? p.label : '+' + p.val;
    gctx.fillText(txt, p.x, p.y);
  }
  gctx.globalAlpha = 1;
  gctx.shadowBlur = 0;
  gctx.textAlign = 'left';
}

function drawWavePop() {
  if (!wavePop) return;
  const a = Math.max(0.12, Math.min(1, wavePop.life / 0.6, (1.4 - wavePop.life) / 0.5 ));
  uctx.save();
  uctx.textAlign = 'center';
  uctx.fillStyle = `rgba(253, 230, 138, ${a})`;
  uctx.font = `bold ${Math.min(18, W * 0.038)}px sans-serif`;
  uctx.shadowColor = '#c026ff';
  uctx.shadowBlur = 12;
  const y = H * 0.26;
  uctx.fillText(`✦ WAVE ${wavePop.n} ✦`, W / 2, y);
  // Subtle crescent underline (sacred geometry tie-in)
  uctx.strokeStyle = `rgba(249, 168, 212, ${a * 0.85})`;
  uctx.lineWidth = 1.5;
  const tw = Math.min(110, W * 0.22);
  uctx.beginPath();
  uctx.moveTo(W/2 - tw, y + 6);
  uctx.quadraticCurveTo(W/2, y + 14, W/2 + tw, y + 6);
  uctx.stroke();
  uctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    gctx.fillStyle = p.color;
    gctx.globalAlpha = Math.max(0, p.life);
    gctx.beginPath();
    gctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    gctx.fill();
  }
  gctx.globalAlpha = 1;
}

function drawSuperEffects() {
  if (!superActive) return;
  // Flash overlay (transformation burst)
  if (superFlash > 0) {
    uctx.fillStyle = `rgba(250,204,21,${superFlash * 0.3})`;
    uctx.fillRect(0, 0, W, H);
  }

  // Flowing protective ribbons (house style: ribbons as living sacred tech — bind/protect during henshin)
  const px = player.x, py = player.y + player.height * 0.35;
  for (let r = 0; r < 3; r++) {
    const phase = gameTime * (2.2 + r * 0.3) + r * 1.8;
    const amp = 22 + r * 6;
    const len = 48 + r * 8;
    uctx.save();
    uctx.strokeStyle = r === 0 ? '#f9a8d4' : (r === 1 ? '#e0aaff' : '#fde68a');
    uctx.lineWidth = 2.5 + r * 0.6;
    uctx.shadowColor = '#c026ff';
    uctx.shadowBlur = 8;
    uctx.beginPath();
    uctx.moveTo(px - 14 - r * 3, py - 10);
    // Living ribbon curve (quadratic for fabric memory + will) + secondary whip curl
    const cx1 = px - 8 + Math.cos(phase) * amp * 0.6;
    const cy1 = py - 18 - Math.sin(phase * 0.8) * (amp * 0.7);
    const cx2 = px + 6 + Math.cos(phase + 1.2) * amp * 0.5;
    const cy2 = py + 12 + Math.sin(phase * 1.1) * (amp * 0.5);
    const ex = px + 18 + r * 2 + Math.cos(phase * 0.7) * 6;
    const ey = py + len * 0.6 + Math.sin(phase) * 8;
    uctx.quadraticCurveTo(cx1, cy1, cx2, cy2);
    uctx.quadraticCurveTo(cx2 + 10, cy2 + 8, ex, ey);
    uctx.stroke();
    // Extra living flick at tip (fabric has will)
    if (r === 1) {
      uctx.beginPath();
      uctx.moveTo(ex, ey);
      uctx.quadraticCurveTo(ex + Math.cos(phase*1.7)*7, ey - 6 + Math.sin(phase)*5, ex + 4, ey + 4);
      uctx.stroke();
    }
    uctx.restore();
  }

  // Orbiting prism shards (sacred geometry) — larger, more legible super attack/collectibles
  for (let i = 0; i < 6; i++) {
    const angle = gameTime * 2 + (i / 6) * Math.PI * 2;
    const radius = 62 + Math.sin(gameTime * 3 + i) * 18;
    const sx = player.x + Math.cos(angle) * radius;
    const sy = player.y + player.height/2 + Math.sin(angle) * radius * 0.6;
    uctx.save();
    uctx.translate(sx, sy);
    uctx.rotate(gameTime * 2 + i);
    uctx.fillStyle = i % 2 === 0 ? '#f0abfc' : '#e9d5ff';
    uctx.shadowColor = '#f0abfc';
    uctx.shadowBlur = 18;
    uctx.beginPath();
    uctx.moveTo(0, -12);
    uctx.lineTo(9, 0);
    uctx.lineTo(0, 12);
    uctx.lineTo(-9, 0);
    uctx.closePath();
    uctx.fill();
    uctx.restore();
  }

  // Text — classic henshin call (theatrical sincerity)
  uctx.save();
  uctx.font = `bold ${Math.min(W*0.06, 32)}px sans-serif`;
  uctx.textAlign = 'center';
  uctx.fillStyle = '#f0abfc';
  uctx.shadowColor = '#a855f7';
  uctx.shadowBlur = 20;
  uctx.fillText('✦ MOON PRISM POWER! ✦', W/2, H * 0.2);
  uctx.restore();
}

function drawUI() {
  // Moon Gauge (top-right, pulses gold near full per house moonlight/tech)
  const gaugeW = Math.min(W * 0.4, 200);
  const gaugeH = 14;
  const gaugeX = W - gaugeW - 16;
  const gaugeY = 16;
  uctx.fillStyle = 'rgba(168,85,247,0.3)';
  uctx.beginPath();
  uctx.roundRect ? uctx.roundRect(gaugeX, gaugeY, gaugeW, gaugeH, 7) : uctx.fillRect(gaugeX, gaugeY, gaugeW, gaugeH);
  uctx.fill();

  const fill = moonGauge / MOON_MAX;
  if (fill > 0) {
    const grad = uctx.createLinearGradient(gaugeX, gaugeY, gaugeX + gaugeW * fill, gaugeY);
    grad.addColorStop(0, '#ec4899');
    grad.addColorStop(1, '#a855f7');
    uctx.fillStyle = grad;
    uctx.shadowColor = '#ec4899';
    uctx.shadowBlur = 6;
    uctx.beginPath();
    uctx.roundRect ? uctx.roundRect(gaugeX, gaugeY, gaugeW * fill, gaugeH, 7) : uctx.fillRect(gaugeX, gaugeY, gaugeW * fill, gaugeH);
    uctx.fill();
    // Pulse glow: intensify as gauge approaches full
    const gaugeRatio = moonGauge / MOON_MAX;
    const pulse = Math.sin(gameTime * 6) * 0.5 + 0.5;
    uctx.shadowBlur = 4 + gaugeRatio * pulse * 14;
    uctx.shadowColor = gaugeRatio > 0.9 ? '#fde68a' : '#ec4899';
  }
  uctx.shadowBlur = 0;
  uctx.fillStyle = '#e2e8f0';
  uctx.font = `${Math.min(11, W*0.02)}px sans-serif`;
  uctx.textAlign = 'right';
  uctx.fillText('MOON PRISM GAUGE', gaugeX + gaugeW, gaugeY + gaugeH + 14);

  // Wave indicator (top center, escalates)
  uctx.textAlign = 'center';
  uctx.fillStyle = '#c4b5fd';
  uctx.font = `${Math.min(14, W*0.025)}px sans-serif`;
  uctx.fillText(`Wave ${wave}`, W/2, 28);

  // Score + combo (bottom-left, high-contrast per polished HUD)
  uctx.textAlign = 'left';
  uctx.fillStyle = '#f1e7ff';
  uctx.font = `bold ${Math.min(16, W*0.028)}px sans-serif`;
  uctx.shadowColor = '#6b21a8';
  uctx.shadowBlur = 3;
  const scoreLabel = `✦ ${score.toLocaleString()}`;
  uctx.fillText(scoreLabel, 16, H - 16);
  if (score > highScore) {
    const scoreW = uctx.measureText(scoreLabel).width;
    uctx.fillStyle = '#fef08c';
    uctx.font = `bold ${Math.min(11, W*0.022)}px sans-serif`;
    uctx.fillText(' ★ PB', 16 + scoreW + 2, H - 16);
  }
  if (combo > 2) {
    uctx.fillStyle = combo >= 10 ? '#fde68a' : combo >= 5 ? '#f0abfc' : '#c4b5fd';
    uctx.font = `bold ${Math.min(13, W*0.022)}px sans-serif`;
    uctx.fillText(`${combo}x COMBO`, 16 + 120, H - 16);
  }
  uctx.shadowBlur = 0;

  if (moonGauge >= MOON_MAX && !superActive) {
    const pulseAlpha = 0.7 + Math.sin(gameTime * 8) * 0.3;
    uctx.fillStyle = `rgba(250,204,21,${pulseAlpha})`;
    uctx.font = `bold ${Math.min(20, W*0.035)}px sans-serif`;
    uctx.textAlign = 'center';
    uctx.shadowColor = '#ec4899';
    uctx.shadowBlur = 15;
    uctx.fillText('✦ MOON PRISM POWER — TAP NOW! ✦', W/2, 55);
    uctx.shadowBlur = 0;
  }
}

// ========== GAME OVER SCREEN ==========
function drawGameOver() {
  uctx.fillStyle = 'rgba(11,11,42,0.78)';
  uctx.fillRect(0, 0, W, H);

  uctx.textAlign = 'center';
  uctx.fillStyle = '#f0abfc';
  uctx.font = `bold ${Math.min(36, W*0.08)}px sans-serif`;
  uctx.shadowColor = '#a855f7';
  uctx.shadowBlur = 20;
  uctx.fillText('✦ Relay Ended ✦', W/2, H*0.34);
  uctx.shadowBlur = 0;

  uctx.fillStyle = '#e2e8f0';
  uctx.font = `${Math.min(22, W*0.05)}px sans-serif`;
  uctx.fillText(`Final Score: ${score}`, W/2, H*0.44);
  uctx.fillStyle = '#fde68a';
  uctx.font = `${Math.min(13, W*0.022)}px sans-serif`;
  uctx.fillText(`★ Best: ${highScore.toLocaleString()}`, W/2, H*0.495);

  uctx.fillStyle = '#c4b5fd';
  uctx.font = `${Math.min(15, W*0.032)}px sans-serif`;
  uctx.fillText(`Waves Survived: ${wave}`, W/2, H*0.535);

  const btnW = Math.min(220, W * 0.52);
  const btnH = 48;
  const btnX = W/2 - btnW/2;
  const btnY = H*0.62;
  uctx.fillStyle = '#ec4899';
  uctx.beginPath();
  uctx.roundRect ? uctx.roundRect(btnX, btnY, btnW, btnH, 24) : uctx.fillRect(btnX, btnY, btnW, btnH);
  uctx.fill();
  uctx.fillStyle = '#fff';
  uctx.font = `bold ${Math.min(19, W*0.042)}px sans-serif`;
  uctx.fillText('✦ Run Again ✦', W/2, btnY + btnH/2 + 6);

  uctx.fillStyle = '#c4b5fd';
  uctx.font = `${Math.min(12, W*0.026)}px sans-serif`;
  uctx.fillText('R  ·  tap  ·  space', W/2, btnY + btnH + 22);
}

// ========== INPUT ==========
const keys = {};

document.addEventListener('keydown', (e) => {
  if (state === 'start') {
    if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'x') {
      startGame();
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      changeLane(-1);
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      changeLane(1);
    }
    return;
  }
  if (state === 'gameover') {
    if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'r') {
      ensureAudio();
      resetGame();
      state = 'playing';
      document.getElementById('startScreen').style.display = 'none';
    }
    return;
  }
  if (state !== 'playing') return;

  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    changeLane(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    changeLane(1);
  } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && player.grounded) {
    player.vy = JUMP_FORCE;
    player.jumping = true;
    player.grounded = false;
    playJump();
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    player.dashing = true;
    player.dashTimer = DASH_DURATION;
    playDash();
  }

  // Super activation
  if (e.key === 'x' || e.key === 'X' || e.key === 'Shift') {
    if (moonGauge >= MOON_MAX && !superActive) activateSuper();
  }

  e.preventDefault();
});

function startGame() {
  ensureAudio();
  resetGame();
  state = 'playing';
  const startScreen = document.getElementById('startScreen');
  startScreen.style.transition = 'opacity 0.45s ease-out, transform 0.45s ease-out';
  startScreen.style.opacity = '0';
  startScreen.style.transform = 'scale(0.985)';
  setTimeout(() => {
    startScreen.style.display = 'none';
    startScreen.style.opacity = '1';
    startScreen.style.transform = 'none';
    const touchControls = document.getElementById('touchControls');
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      touchControls.style.display = 'flex';
    }
  }, 420);
}

// Touch controls
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
  if (state === 'start') {
    // tap anywhere on start to begin
    startGame();
    e.preventDefault();
    return;
  }
  if (state === 'gameover') {
    // Any tap on gameover restarts (large forgiving target, clear controls)
    ensureAudio();
    resetGame();
    state = 'playing';
    document.getElementById('startScreen').style.display = 'none';
    return;
  }
  if (state !== 'playing') return;

  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();

  // Super activation tap on center of screen
  if (moonGauge >= MOON_MAX && !superActive) {
    activateSuper();
    e.preventDefault();
    return;
  }
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (state !== 'playing') return;
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (state !== 'playing') return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  if (dt < 300) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      changeLane(dx < 0 ? -1 : 1);
    } else if (Math.abs(dy) > 30) {
      if (dy < 0 && player.grounded) {
        player.vy = JUMP_FORCE;
        player.jumping = true;
        player.grounded = false;
        playJump();
      } else if (dy > 0) {
        player.dashing = true;
        player.dashTimer = DASH_DURATION;
        playDash();
      }
    }
  }
}, { passive: false });

// Touch buttons
document.getElementById('btnLeft')?.addEventListener('pointerdown', () => {
  if (state === 'playing') { changeLane(-1); }
});
document.getElementById('btnRight')?.addEventListener('pointerdown', () => {
  if (state === 'playing') { changeLane(1); }
});
document.getElementById('btnUp')?.addEventListener('pointerdown', () => {
  if (state === 'playing' && player.grounded) {
    player.vy = JUMP_FORCE; player.jumping = true; player.grounded = false; playJump();
  }
});
document.getElementById('btnDown')?.addEventListener('pointerdown', () => {
  if (state === 'playing') {
    player.dashing = true; player.dashTimer = DASH_DURATION; playDash();
  }
});

// Start button
document.getElementById('startBtn').addEventListener('click', () => {
  startGame();
});

// Click on game area for super activation on mobile / also restart
uiCanvas?.addEventListener('pointerdown', (e) => {
  if (state === 'gameover') {
    ensureAudio();
    resetGame();
    state = 'playing';
    document.getElementById('startScreen').style.display = 'none';
    return;
  }
  if (moonGauge >= MOON_MAX && !superActive && state === 'playing') {
    activateSuper();
  }
});

// Autostart for browser verification (real runtime exercise after interaction)
const params = new URLSearchParams(location.search);
if (params.get('autostart') === '1') {
  setTimeout(() => {
    ensureAudio();
    resetGame();
    state = 'playing';
    const ss = document.getElementById('startScreen');
    if (ss) ss.style.display = 'none';
  }, 900);
}

// Stop music cleanly on gameover (keeps gesture promise honest)
function stopMusicOnEnd() { if (musicEnabled) stopMusic(); }

// ========== GAME LOOP ==========
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  dt = Math.min(dt, 0.05); // Cap delta to prevent spiral

  update(dt);
  draw();

  if (state === 'gameover') drawGameOver();

  requestAnimationFrame(gameLoop);
}

// ========== INIT ==========
initScenery();
// Place player for attractive start preview (centered lane, visible)
player.x = getLaneX(0);
player.y = getGroundY() - player.height - 2;
player.targetLane = 0;
// Seed immediate ambient demo elements so first screen starts "in action" with visible prism shards (collect goals) + shadow (deflect) under the glass card — addresses playtest (more direct action, no passive)
shards.push({ x: W * 0.58, lane: -1, targetX: getLaneX(-1), y: getGroundY() - 52, size: 20, rotation: 1.2, glow: 0.42, color: '#fde68a', ambient: true });
shards.push({ x: W * 0.73, lane: 1, targetX: getLaneX(1), y: getGroundY() - 26, size: 19, rotation: 3.8, glow: 0.32, color: '#f0abfc', ambient: true });
shards.push({ x: W * 0.89, lane: 0, targetX: getLaneX(0), y: getGroundY() - 44, size: 18, rotation: 0.6, glow: 0.38, color: '#fde68a', ambient: true });
obstacles.push({ x: W * 0.91, lane: 0, targetX: getLaneX(0), y: getGroundY() - 38, w: 30, h: 36, type: 'shadow', eyes: 1, hit: false, ambient: true });
// Subtle best score on start card (motivation, no generic copy)
const bestEl = document.getElementById('startBest');
if (bestEl && highScore > 0) bestEl.textContent = `★ Best: ${highScore.toLocaleString()}`;
requestAnimationFrame(gameLoop);

})();
</script>
