<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03030f"/>
      <stop offset="60%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#12122e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a30"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="0.5" cy="0.35" r="0.35">
      <stop offset="0%" stop-color="rgba(212,197,240,0.15)"/>
      <stop offset="100%" stop-color="rgba(212,197,240,0)"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="200" cy="80" r="1.5" fill="#d4c5f0" opacity="0.6"/>
  <circle cx="450" cy="120" r="1" fill="#d4c5f0" opacity="0.3"/>
  <circle cx="700" cy="60" r="2" fill="#d4c5f0" opacity="0.8"/>
  <circle cx="1000" cy="140" r="1.2" fill="#d4c5f0" opacity="0.5"/>
  <circle cx="1200" cy="90" r="0.8" fill="#d4c5f0" opacity="0.4"/>
  <circle cx="300" cy="200" r="1" fill="#d4c5f0" opacity="0.7"/>
  <circle cx="850" cy="180" r="1.8" fill="#d4c5f0" opacity="0.6"/>
  <circle cx="1400" cy="50" r="1" fill="#d4c5f0" opacity="0.5"/>
  <!-- Moon -->
  <circle cx="768" cy="180" r="180" fill="url(#moon-glow)"/>
  <circle cx="768" cy="180" r="38" fill="#d4c5f0"/>
  <circle cx="768" cy="180" r="12" fill="rgba(5,5,16,0.55)" cx="790"/>
  <!-- Ground -->
  <rect x="0" y="665" width="1536" height="359" fill="url(#ground)"/>
  <!-- Grass silhouette -->
  <path d="M0 680 Q20 670 40 675 Q60 665 80 672 ..." fill="none" stroke="rgba(30,50,40,0.25)" stroke-width="1"/>
  <!-- Flower stems -->
  <line x1="400" y1="700" x2="410" y2="630" stroke="#d4c5f0" stroke-width="2"/>
  <ellipse cx="410" cy="630" rx="8" ry="6" fill="rgba(212,197,240,0.5)" transform="rotate(15 410 630)"/>
  <line x1="650" y1="720" x2="640" y2="640" stroke="#6eaa8f" stroke-width="2.5"/>
  <ellipse cx="630" cy="638" rx="6" ry="4" fill="#6eaa8f" transform="rotate(-10 630 638)"/>
  <line x1="900" y1="690" x2="915" y2="615" stroke="#c084fc" stroke-width="2"/>
  <polygon points="915,615 915,605 925,610" fill="rgba(252,217,160,0.6)"/>
  <!-- Fireflies -->
  <circle cx="500" cy="550" r="3" fill="rgba(212,197,240,0.4)"/>
  <circle cx="800" cy="500" r="2" fill="rgba(212,197,240,0.3)"/>
  <circle cx="1100" cy="580" r="3" fill="rgba(212,197,240,0.35)"/>
  <!-- Phase indicator -->
  <rect x="1280" y="14" width="14" height="14" rx="7" fill="rgba(212,197,240,0.5)"/>
  <text x="1300" y="24" font-size="11" fill="rgba(212,197,240,0.35)" font-family="Georgia">Full Moon</text>
  <!-- Hint bar -->
  <rect x="618" y="968" width="300" height="24" rx="12" fill="rgba(5,5,16,0.75)" stroke="rgba(212,197,240,0.18)"/>
  <text x="756" y="984" font-size="11" fill="rgba(212,197,240,0.45)" text-anchor="middle" font-family="Georgia">Tap stems to bloom · Hold for glow</text>
  <!-- Credit -->
  <text x="768" y="1010" font-size="10" fill="rgba(212,197,240,0.12)" text-anchor="middle" font-family="Georgia">SaiLOR MOON — cozy interactive toys, built by moonlight</text>
</svg>