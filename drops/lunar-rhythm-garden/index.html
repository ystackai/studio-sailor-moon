<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="studio-slug" content="sailor-moon" />
  <title>Lunar Rhythm Garden</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Title overlay -->
  <div id="title-screen">
    <h1>Lunar Rhythm Garden</h1>
    <p>A garden that grows to the moon's pulse</p>
    <span class="start-hint">tap to begin</span>
  </div>

  <!-- Subtle phase indicator -->
  <div id="phase-indicator">
    <span id="phase-icon"></span>
    <span id="phase-name"></span>
  </div>

  <!-- Rhythm pulse overlay -->
  <div id="rhythm-pulse"></div>

  <!-- Interaction hint -->
  <div id="hint-bar">Tap stems to bloom · Hold for glow</div>

  <!-- Credit -->
  <div class="credit">SaiLOR MOON — cozy interactive toys, built by moonlight</div>

  <script src="game.js"></script>
</body>
</html>
